# Build and test on Linux, macOS and Windows. A tag v* also publishes the
# binaries as a release.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # an older glibc, so the binary runs on older distributions too
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.10.3"
          cabal-version: latest

      - name: Plan
        run: |
          cabal update
          cabal build all --enable-tests --dry-run

      - uses: actions/cache@v6
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ matrix.name }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ matrix.name }}-

      - name: Build
        run: cabal build all --enable-tests

      - name: Test
        run: cabal test

      - name: Package
        run: |
          dir=stemma-${{ matrix.name }}
          mkdir -p "$dir"
          cp "$(cabal list-bin exe:stemma)" "$(cabal list-bin exe:stemma-server)" "$dir"
          cp -r README.md docs examples "$dir"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$dir.zip" "$dir"
          else
            strip "$dir/stemma" "$dir/stemma-server"
            tar czf "$dir.tar.gz" "$dir"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: stemma-${{ matrix.name }}
          path: |
            stemma-*.zip
            stemma-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes stemma-*
