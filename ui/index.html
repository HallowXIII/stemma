    if (!r.lexicon) h += `<div class="box bad">The preview build failed.</div><pre class="log">${esc(r.stderr)}</pre>`;
    else {
      h += `<div class="box ${r.diff?.length ? "warn" : "good"} banner">${r.diff?.length
        ? `${r.diff.length} form${r.diff.length === 1 ? "" : "s"} would change`
        : "No forms would change"}${mm.length ? `, ${mm.length} new expectation mismatch${mm.length === 1 ? "" : "es"}` : ""}${old.length ? ` <span class="muted">(${old.length} already failing)</span>` : ""}</div>`;
      if (r.diff?.length) h += `<ul class="plain">${r.diff.slice(0, 300).map((l) => `<li>${linkDiffLine(l)}</li>`).join("")}</ul>`;
      if (mm.length) h += `<h3>New mismatches</h3><ul class="plain">${mm.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>`;
    }
    if (errs.length && r.lexicon) h += `<pre class="log">${esc(errs.join("\n"))}</pre>`;
  } else if (dirty) {
    h += `<div class="box warn banner">Unsaved changes. <b>Preview</b> (<kbd>⌘↵</kbd>) shows what they would change without saving; <b>Save</b> (<kbd>⌘S</kbd>) writes the file and rebuilds.</div>`;
  }

  // The rule under the caret.
  const caret = s + R.line;
  const st = stats[caret];
  if (st) {
    const forms = st.hits;
    h += `<h3>Rule on line ${caret + 1}${src.preview ? " · preview" : ""}</h3><div class="rule">${hlRule(st.text)}</div>`;
    if (!st.used) h += `<p class="muted">No stage uses segment ${info[caret].seg} of this file.</p>`;
    else if (!forms.length) h += `<p style="color:var(--warn)">This rule never applies to any form${src.preview ? " in the preview" : ""}.</p>`;
    else {
      const oneStage = new Set(forms.map((x) => x.stage)).size === 1;
      h += `<p class="muted">Applied ${forms.length} time${forms.length === 1 ? "" : "s"}, to ${new Set(forms.map((x) => x.id + "|" + x.stage)).size} form(s)${oneStage ? ` in ${esc(stageName(forms[0].stage))}` : ""}:</p>
        <div class="card"><table><tr><th>Item</th><th>Before</th><th>After</th></tr>${forms.slice(0, 300).map((x) => {
          const it = src.lex.items[x.id];
          return `<tr><td>${S.lex.items[x.id] ? `<a href="${href(x.id)}">${esc(x.id)}</a>` : esc(x.id)}${oneStage ? "" : ` <span class="faint">${esc(stageAbbr(x.stage))}</span>`}<div class="faint" style="font-size:12px">${esc(it?.reflexes?.[x.stage]?.gloss ?? it?.gloss ?? "")}</div></td>
            <td><span class="f ph">${esc(x.before ?? "—")}</span></td>
            <td>${x.after == null ? `<span class="badge lost">deleted</span>` : `<span class="f ph">${esc(x.after)}</span>`}</td></tr>`;
        }).join("")}</table></div>${forms.length > 300 ? `<p class="muted">…and ${forms.length - 300} more</p>` : ""}`;
    }
    if (dirty && !src.preview) h += `<p class="faint" style="font-size:12px">Counts are from the last build; preview to see them for your edit.</p>`;
  }

  // Segments shown here: rules that never apply.
  const segs = new Map();
  info.forEach((li, n) => {
    const x = stats[n];
    if (n < s || n >= e || !x || !x.used) return;
    if (!segs.has(li.seg)) segs.set(li.seg, { rules: 0, dead: [] });
    const g = segs.get(li.seg);
    g.rules++;
    if (!x.hits.length) g.dead.push(n);
  });
  const uses = stagesUsing(S.lex, file).filter((u) => u.role === "rules");
  if (outline && !outline.ok) {
    h += `<h3>Never applies</h3><p class="muted">Fix the parse error to see which rules never apply.</p>`;
  } else if (!outline) {
    // Still checking.
  } else if (view.role === "orthography") {
    h += `<p class="muted">Spelling rules have no traces, so there are no counts.</p>`;
  } else if (segs.size) {
    h += `<h3>${view.stage ? esc(stageName(view.stage)) : "Segments"}${src.preview ? " · preview" : ""}</h3>`;
    for (const [k, g] of segs) {
      const names = uses.filter((u) => u.seg == null || u.seg === k).map((u) => stageName(u.stage)).join(", ");
      h += `<div class="seg">${view.stage ? "" : `<b>#${k}</b> → ${esc(names)} <span class="muted">· </span>`}<span class="muted">${g.rules} rule${g.rules === 1 ? "" : "s"}${g.dead.length ? `, <span style="color:var(--warn)">${g.dead.length} never appl${g.dead.length === 1 ? "ies" : "y"}</span>` : ", all apply"}</span>
        ${g.dead.map((n) => `<a class="jump" href="#" data-line="${n}">${n + 1}: ${esc(stripComment(lines[n]))}</a>`).join("")}</div>`;
    }
  } else if (!stagesUsing(S.lex, file).length) {
    h += `<p class="muted">No stage in family.yaml uses this file.</p>`;
  }
  if (view.stage && view.seg != null) {
    const before = Array.from({ length: view.seg - 1 }, (_, k) => k + 1);
    if (before.length) h += `<p class="faint" style="font-size:12px">Categories declared in earlier segments of ${esc(file)} are still in force here.</p>`;
  }
  h += `<p class="faint" style="font-size:12px;margin-top:24px">The number beside each rule is how many forms it changed. Click it, or put the caret on a line, to list them.</p>`;
  return h;
}

window.addEventListener("beforeunload", (e) => {
  if (R.files?.some((f) => isDirty(f.file))) { e.preventDefault(); e.returnValue = ""; }
});

// ---------------------------------------------------------------------------
// Lexicon editing: an entry's form and gloss, or its whole YAML block, and
// new entries. Edits change only the lines involved, so comments and layout
// survive, and are built on a copy of the project before they are saved.

const L = {
  sources: null,   // [{file, content}]: the project's YAML files, as saved
  edit: null,      // the entry being edited (see startEdit)
  create: null,    // a new entry being written (see viewNew)
};

async function loadSources() {
  L.sources = await (await fetch("api/sources", { cache: "no-store" })).json();
}
const srcText = (f) => L.sources.find((x) => x.file === f)?.content ?? "";
const indentOf = (l) => l.length - l.trimStart().length;
const blankOrComment = (l) => !l.trim() || l.trim().startsWith("#");
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const QUOTED = `"(?:[^"\\\\]|\\\\.)*"|'(?:[^']|'')*'`;

// Lexicon files first, then morphology, then the rest (never family.yaml).
function entryFiles() {
  const rank = (f) => f.startsWith("lexicon/") ? 0 : /morphology\.ya?ml$/.test(f) ? 1 : 2;
  return L.sources.filter((s) => !/(^|\/)family\.ya?ml$/.test(s.file)).sort((a, b) => rank(a.file) - rank(b.file));
}

// Where an entry is written, as lines [start, end) of a file:
//   item  `- id: X` and the keys below it, at keyIndent
//   key   `X:` under affixes:, with block keys below it
//   flow  `X: { ... }` or `- { id: X, ... }` on one line
function locateEntry(id) {
  const item = new RegExp(`^(\\s*)-\\s+id:\\s*(["']?)${reEsc(id)}\\2\\s*(#.*)?$`);
  const flowItem = new RegExp(`^\\s*-\\s*\\{.*\\bid:\\s*(["']?)${reEsc(id)}\\1\\s*[,}]`);
  const key = new RegExp(`^(\\s+)(["']?)${reEsc(id)}\\2\\s*:(.*)$`);
  for (const { file, content } of entryFiles()) {
    const lines = content.split("\n");
    let top = null, childIndent = null;
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (/^[^\s#-][^:]*:/.test(l)) { top = l.split(":")[0].trim(); childIndent = null; continue; }
      let m;
      if ((m = l.match(item))) {
        const dash = m[1].length;
        let end = i + 1;
        for (let k = i + 1; k < lines.length; k++) {
          if (blankOrComment(lines[k])) continue;
          if (indentOf(lines[k]) <= dash) break;
          end = k + 1;
        }
        return { file, start: i, end, style: "item", keyIndent: l.indexOf("id:") };
      }
      if (flowItem.test(l)) return { file, start: i, end: i + 1, style: "flow" };
      if (top === "affixes" && !blankOrComment(l)) {
        childIndent ??= indentOf(l);
        if (indentOf(l) !== childIndent || !(m = l.match(key))) continue;
        const rest = m[3].trim();
        if (rest.startsWith("{")) return { file, start: i, end: i + 1, style: "flow" };
        if (rest && !rest.startsWith("#")) return null;   // e.g. an alias; edit the YAML by hand
        let end = i + 1, keyIndent = null;
        for (let k = i + 1; k < lines.length; k++) {
          if (blankOrComment(lines[k])) continue;
          if (indentOf(lines[k]) <= childIndent) break;
          keyIndent ??= indentOf(lines[k]);
          end = k + 1;
        }
        return { file, start: i, end, style: "key", keyIndent: keyIndent ?? childIndent + 2 };
      }
    }
  }
  return null;
}

function parseScalar(v) {
  v = v.trim();
  if (v.startsWith('"')) { try { return JSON.parse(v); } catch { return undefined; } }
  if (v.startsWith("'")) return v.slice(1, -1).replace(/''/g, "'");
  if (v === "~" || v === "null") return null;
  return v;
}

// A block value and its trailing comment: `"*ir₁-"   # note`.
function splitValue(v) {
  const q = v.match(new RegExp(`^\\s*(${QUOTED})(.*)$`));
  if (q) return { value: q[1], comment: q[2].trim() };
  const i = v.search(/\s#/);
  return i < 0 ? { value: v.trim(), comment: "" } : { value: v.slice(0, i).trim(), comment: v.slice(i).trim() };
}

const flowField = (field) => new RegExp(`([{,]\\s*)${reEsc(field)}(\\s*:\\s*)(${QUOTED}|[^,}#]*?)(\\s*)(?=[,}])`);

// A scalar field of an entry: its value, null if absent, undefined if it
// isn't a plain scalar (a block scalar or a list), which this doesn't edit.
function getField(text, loc, field) {
  const lines = text.split("\n");
  if (loc.style === "flow") {
    const m = lines[loc.start].match(flowField(field));
    return m ? parseScalar(m[3]) : null;
  }
  for (let k = loc.start + 1; k < loc.end; k++) {
    const l = lines[k];
    if (indentOf(l) !== loc.keyIndent || blankOrComment(l)) continue;
    const m = l.match(new RegExp(`^\\s*${reEsc(field)}\\s*:(.*)$`));
    if (!m) continue;
    const { value } = splitValue(m[1]);
    return /^[|>[{&*!]/.test(value) ? undefined : parseScalar(value);
  }
  return null;
}

// The text with one scalar field set (added if absent).
function setField(text, loc, field, value) {
  const lines = text.split("\n");
  const q = JSON.stringify(value);
  if (loc.style === "flow") {
    const l = lines[loc.start];
    if (flowField(field).test(l)) lines[loc.start] = l.replace(flowField(field), (_, a, b, _v, d) => a + field + b + q + d);
    else {
      const close = l.lastIndexOf("}");
      const inner = l.slice(l.indexOf("{") + 1, close).trim();
      lines[loc.start] = l.slice(0, close).trimEnd() + (inner ? ", " : " ") + `${field}: ${q} ` + l.slice(close);
    }
    return lines.join("\n");
  }
  let after = loc.start;
  for (let k = loc.start + 1; k < loc.end; k++) {
    const l = lines[k];
    if (indentOf(l) !== loc.keyIndent || blankOrComment(l)) continue;
    if (/^\s*form\s*:/.test(l)) after = k;
    const m = l.match(new RegExp(`^(\\s*${reEsc(field)}\\s*:)(.*)$`));
    if (m) {
      const { comment } = splitValue(m[2]);
      lines[k] = `${m[1]} ${q}${comment ? "   " + comment : ""}`;
      return lines.join("\n");
    }
  }
  lines.splice(after + 1, 0, " ".repeat(loc.keyIndent) + `${field}: ${q}`);
  return lines.join("\n");
}

// --- Editing an entry -------------------------------------------------------------

async function startEdit(id, mode = "fields") {
  if (!L.sources) await loadSources();
  const loc = locateEntry(id);
  const base = loc ? srcText(loc.file) : null;
  L.edit = { id, loc, base, mode, preview: null, previewing: false, error: null };
  if (loc) {
    const lines = base.split("\n");
    L.edit.yaml = lines.slice(loc.start, loc.end).join("\n");
    L.edit.origForm = getField(base, loc, "form");
    L.edit.origGloss = getField(base, loc, "gloss");
    L.edit.form = L.edit.origForm ?? "";
    L.edit.gloss = L.edit.origGloss ?? "";
  }
  route();
}

// The whole file as it would be with the edit.
function editedText(e = L.edit) {
  if (e.mode === "create") return createdText(e);
  if (e.mode === "delete") {
    // Drop the block, and one blank line beside it so no gap is left.
    const lines = e.base.split("\n");
    let { start, end } = e.loc;
    if (end < lines.length && !lines[end].trim() && (start === 0 || !lines[start - 1].trim())) end++;
    else if (start > 0 && !lines[start - 1].trim() && end >= lines.length - 1) start--;
    return [...lines.slice(0, start), ...lines.slice(end)].join("\n");
  }
  if (e.mode === "yaml") {
    const lines = e.base.split("\n");
    return [...lines.slice(0, e.loc.start), ...e.yaml.split("\n"), ...lines.slice(e.loc.end)].join("\n");
  }
  let t = e.base;
  if (typeof e.origForm === "string" && e.form !== e.origForm) t = setField(t, e.loc, "form", e.form);
  if (e.origGloss !== undefined && e.gloss !== (e.origGloss ?? "") && !(e.origGloss == null && e.gloss === ""))
    t = setField(t, e.loc, "gloss", e.gloss);
  return t;
}

const editDirty = (e = L.edit) => !!e?.loc && editedText(e) !== e.base;

async function previewEdit(e, file) {
  e.previewing = true;
  e.error = null;
  route();
  try {
    const content = editedText(e);
    const result = expandResult(await (await fetch("api/preview", { method: "POST", body: JSON.stringify({ file, content }) })).json());
    e.preview = { content, result };
  } catch (err) { e.error = String(err); }
  e.previewing = false;
  route();
}

// Save, unless the file changed on disk since editing began.
async function saveEdit(e, file, then) {
  // Never save YAML that breaks the build: preview first if needed.
  if (!e.preview || e.preview.content !== editedText(e)) await previewEdit(e, file);
  if (!e.preview?.result.lexicon) {
    e.error = (e.error ? e.error + "\n" : "") + "Not saved: the project wouldn't build with this edit.\n\n" + (e.preview?.result.stderr ?? "");
    return route();
  }
  await loadSources();
  if (srcText(file) !== e.base) {
    e.error = `${file} changed on disk since you started editing. Cancel and edit again to pick up the changes.`;
    return route();
  }
  const r = await fetch("api/source", { method: "PUT", body: JSON.stringify({ file, content: editedText(e) }) });
  if (!r.ok) { e.error = "Couldn't save: " + ((await r.json()).error || r.status); return route(); }
  await loadSources();
  then();
  await rebuild({ fromSave: true });
}

// What a preview build says, and how this entry's reflexes would change.
function previewHtml(e, id) {
  if (e.previewing) return `<p class="muted">Building a copy of the project…</p>`;
  if (e.error) return `<div class="box bad" style="white-space:pre-wrap">${esc(e.error)}</div>`;
  const p = e.preview;
  if (!p) return "";
  const stale = p.content !== editedText(e);
  const r = p.result;
  let h = stale ? `<p><span class="badge irr">out of date</span> <span class="muted">You've edited since this preview.</span></p>` : "";
  if (!r.lexicon) return h + `<div class="box bad">The project wouldn't build with this edit.</div><pre class="log">${esc(r.stderr)}</pre>`;
  const { fresh, old } = splitMismatches(r);
  const n = r.diff?.length ?? 0;
  const goneN = (r.diff || []).filter((l) => /: gone \(was /.test(l)).length;
  const what = e.mode === "delete" && goneN === n ? `${n} form${n === 1 ? "" : "s"} would be removed`
    : `${n} form${n === 1 ? "" : "s"} would change`;
  h += `<div class="box ${fresh.length ? "bad" : n ? "warn" : "good"}">${n ? what : "No forms would change"}${fresh.length
    ? `, ${fresh.length} new expectation mismatch${fresh.length === 1 ? "" : "es"}` : ""}${old.length
    ? ` <span class="muted">(${old.length} already failing)</span>` : ""}</div>`;
  const now = S.lex.items[id], next = id && r.lexicon.items[id];
  if (!now && next) {
    const show = (s) => { const x = next.reflexes[s]; return !x ? null : s === r.lexicon.root ? x.forms : x.spelled ?? x.forms; };
    h += `<div class="card" style="margin-top:8px"><table><tr><th>Stage</th><th>Form</th></tr>${IX.treeOrder.filter((s) => next.reflexes[s]).map((s) =>
      `<tr><td>${esc(stageName(s))}</td><td>${fmt(show(s), s)}</td></tr>`).join("")}</table></div>`;
  }
  if (now && next) {
    const rows = IX.treeOrder.filter((s) => !same(now.reflexes[s]?.forms, next.reflexes[s]?.forms)
      || !same(now.reflexes[s]?.spelled, next.reflexes[s]?.spelled));
    if (rows.length) h += `<div class="card" style="margin-top:8px"><table><tr><th>Stage</th><th>Now</th><th>After</th></tr>${rows.map((s) => {
      const show = (it) => { const x = it.reflexes[s]; return !x ? null : s === r.lexicon.root ? x.forms : x.spelled ?? x.forms; };
      return `<tr><td>${esc(stageName(s))}</td><td>${fmt(show(now), s)}</td><td>${fmt(show(next), s)}</td></tr>`;
    }).join("")}</table></div>`;
  }
  const others = (r.diff || []).filter((l) => { const m = l.match(/^\S+\s+(\S+?):/); return !m || m[1] !== id; });
  if (others.length) h += `<details style="margin-top:8px" ${others.length <= 12 ? "open" : ""}><summary class="muted">${others.length} other form${others.length === 1 ? "" : "s"} (cells, derivatives, compounds)</summary>
    <ul class="plain">${others.slice(0, 300).map((l) => `<li>${linkDiffLine(l)}</li>`).join("")}</ul></details>`;
  if (fresh.length) h += `<h3>New mismatches</h3><ul class="plain">${fresh.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>`;
  if (old.length) h += `<details><summary class="muted">${old.length} already failing before this edit</summary><ul class="plain">${old.map((m) => `<li class="muted">${esc(m)}</li>`).join("")}</ul></details>`;
  return h;
}

// A preview's expectation mismatches: new ones, and ones the current sources
// already have (the server works these out for each preview).
function splitMismatches(result) {
  const mm = (result.stderr || "").split("\n").filter((l) => l.startsWith("MISMATCH: ")).map((l) => l.slice(10));
  const known = new Set(result.baseline_mismatches ?? S.knownMismatches ?? []);
  return { fresh: mm.filter((m) => !known.has(m)), old: mm.filter((m) => known.has(m)) };
}

// Entries written inside this one's block (nested derivatives), which a
// delete takes with it.
function nestedEntries(e) {
  const lines = e.base.split("\n").slice(e.loc.start + 1, e.loc.end);
  return lines.map((l) => l.match(/^\s*-\s+id:\s*["']?([^\s"'#]+)/)?.[1]).filter(Boolean);
}

// Who still refers to an entry being deleted, and what to change first.
function usedWarning(users) {
  if (!users.length) return "";
  const cells = users.filter((u) => S.lex.items[u]?.kind === "cell");
  const others = users.filter((u) => !cells.includes(u));
  const parts = [];
  if (others.length) parts.push(`Still used by ${others.map(linkId).join(", ")}; change ${others.length === 1 ? "it" : "them"} first.`);
  if (cells.length) {
    const pds = [...new Set(cells.map((c) => S.lex.items[S.lex.items[c].owner]?.paradigm).filter(Boolean))];
    parts.push(`Used in the paradigm cells ${cells.map(linkId).join(", ")}${pds.length ? ` (paradigm ${pds.map(esc).join(", ")})` : ""}; take it out of the paradigm in the morphology file first.`);
  }
  return `<div class="box warn">${parts.join(" ")} Otherwise the project won't build, and the delete is refused.</div>`;
}

function deleteCardHtml(id) {
  const e = L.edit, loc = e.loc;
  const removed = e.base.split("\n").slice(loc.start, loc.end).join("\n");
  const nested = nestedEntries(e);
  const gone = new Set([id, ...nested]);
  const users = [...gone].flatMap((g) => IX.usedIn.get(g) || [])
    .filter((u) => !gone.has(u) && !gone.has(S.lex.items[u]?.owner));
  return `<div class="editcard danger">
    <div class="ehead"><b>Delete ${fmt(formsAt(id, S.lex.items[id].formed), S.lex.items[id].formed)}?</b>
      <span class="muted mono" style="font-size:12px">${esc(loc.file)}:${loc.start + 1}${loc.end - loc.start > 1 ? `–${loc.end}` : ""}</span></div>
    <p class="muted" style="margin:4px 0">These lines will be removed:</p>
    <pre class="log removed">${esc(removed)}</pre>
    ${nested.length ? `<p>It also deletes the derivative${nested.length === 1 ? "" : "s"} written inside it: ${nested.map(linkId).join(", ")}.</p>` : ""}
    ${usedWarning([...new Set(users)])}
    <div class="ebtns">
      <button data-act="cancel">Cancel</button>
      <span class="spacer"></span>
      <button data-act="save" class="danger-solid" ${e.previewing || (e.preview && !e.preview.result.lexicon) ? "disabled" : ""}>Delete entry</button>
    </div>
    <div id="le-out">${previewHtml(e, id)}</div>
  </div>`;
}

// The editor shown on an entry's page.
function editCardHtml(id) {
  const e = L.edit;
  if (e.loc && e.mode === "delete") return deleteCardHtml(id);
  const it = S.lex.items[id];
  if (!e.loc) {
    return `<div class="editcard"><div class="box warn">Couldn't find where <span class="mono">${esc(id)}</span> is written in the project's YAML.
      Entries are found as <span class="mono">- id: ${esc(id)}</span> in a lexicon file or as a key under <span class="mono">affixes:</span>.</div>
      <p><button data-act="cancel">Close</button></p></div>`;
  }
  const loc = e.loc;
  const fieldsOk = e.origForm !== undefined && e.origGloss !== undefined;
  const mode = fieldsOk ? e.mode : "yaml";
  let body;
  if (mode === "fields") {
    body = `<div class="fields">
      ${typeof e.origForm === "string"
        ? `<label class="fld">Form <input id="le-form" value="${esc(e.form)}" spellcheck="false" autocomplete="off"></label>`
        : `<div class="fld">Form <span class="muted" style="font-size:13px">built from <b>${esc(it.source ?? "its source")}</b>; change that under YAML</span></div>`}
      <label class="fld">Gloss <input id="le-gloss" value="${esc(e.gloss)}" spellcheck="true" autocomplete="off"></label>
    </div>`;
  } else {
    const rows = Math.min(24, Math.max(4, e.yaml.split("\n").length + 1));
    body = `<textarea id="le-yaml" class="yaml" rows="${rows}" spellcheck="false" wrap="off">${esc(e.yaml)}</textarea>`;
  }
  return `<div class="editcard">
    <div class="ehead">
      ${fieldsOk ? `<span class="seg2"><a href="#" data-act="mode-fields" class="${mode === "fields" ? "on" : ""}">Form &amp; gloss</a><a href="#" data-act="mode-yaml" class="${mode === "yaml" ? "on" : ""}">YAML</a></span>` : ""}
      <span class="muted mono" style="font-size:12px">${esc(loc.file)}:${loc.start + 1}${loc.end - loc.start > 1 ? `–${loc.end}` : ""}</span>
      <span class="spacer"></span>
      <span class="dirty" style="color:var(--warn);font-size:12px">${editDirty() ? "● unsaved" : ""}</span>
    </div>
    ${body}
    <div class="ebtns">
      <button data-act="cancel">${editDirty() ? "Discard" : "Close"}</button>
      <button data-act="preview" ${e.previewing ? "disabled" : ""} title="⌘↵">${e.previewing ? "Previewing…" : "Preview"}</button>
      <button data-act="save" class="primary" ${editDirty() ? "" : "disabled"} title="Save and rebuild (⌘S)">Save</button>
    </div>
    <div id="le-out">${previewHtml(e, id)}</div>
  </div>`;
}

// --- New entries --------------------------------------------------------------------

function lexiconFiles() {
  const fs = entryFiles().filter((f) => /^\s*-\s+id:/m.test(f.content) || f.file.startsWith("lexicon/"));
  return fs.length ? fs : entryFiles();
}

function newEntryBlock(c) {
  const dash = (srcText(c.file).match(/^([ \t]*)-\s+id:/m)?.[1] ?? "");
  const pad = dash + "  ";
  const lines = [`${dash}- id: ${c.id}`, `${pad}form: ${JSON.stringify(c.form)}`];
  if (c.gloss) lines.push(`${pad}gloss: ${JSON.stringify(c.gloss)}`);
  if (c.category) lines.push(`${pad}category: [{ at: ${S.lex.root}, is: ${JSON.stringify(c.category)} }]`);
  return lines.join("\n");
}

function createdText(c = L.create) {
  const base = c.base;
  const sep = base === "" ? "" : base.endsWith("\n\n") ? "" : base.endsWith("\n") ? "\n" : "\n\n";
  return base + sep + newEntryBlock(c) + "\n";
}

function createProblem(c = L.create) {
  if (!c.id) return "Give it an ID.";
  if (!/^[^\s:#{}\[\],&*!|>'"%@`]+$/.test(c.id)) return "IDs can't contain spaces or YAML punctuation.";
  if (S.lex.items[c.id] || locateEntry(c.id)) return `There is already an entry ${c.id}.`;
  if (!c.form || c.form === "*") return "Give it a form.";
  return null;
}

async function startCreate() {
  if (!L.sources) await loadSources();
  const files = lexiconFiles();
  const file = files[0]?.file;
  L.create = { file, base: srcText(file), id: "", form: "*", gloss: "", category: "", preview: null, previewing: false, error: null };
  location.hash = "#/new";
}

function viewNew() {
  if (!S.live) return `<div class="wrap"><h2>New entry</h2><p class="muted">Adding entries needs the server: run <span class="mono">stemma-server -d &lt;project&gt;</span>.</p></div>`;
  const c = L.create;
  if (!c) { startCreate(); return ""; }
  const problem = createProblem();
  return `<div class="wrap"><h2>New entry</h2>
    <p class="muted">A new word in ${esc(stageName(S.lex.root))}. For events, notes, derivatives and the rest, edit its YAML once it exists.</p>
    <div class="editcard">
      <div class="fields">
        <label class="fld">File <select id="nc-file">${lexiconFiles().map((f) =>
          `<option value="${esc(f.file)}" ${f.file === c.file ? "selected" : ""}>${esc(f.file)}</option>`).join("")}</select></label>
        <label class="fld">ID <input id="nc-id" value="${esc(c.id)}" spellcheck="false" autocomplete="off" placeholder="e.g. tan"></label>
        <label class="fld">Form <input id="nc-form" value="${esc(c.form)}" spellcheck="false" autocomplete="off" placeholder="*tan"></label>
        <label class="fld">Gloss <input id="nc-gloss" value="${esc(c.gloss)}" autocomplete="off"></label>
        <label class="fld">Category <span class="faint">(optional)</span> <input id="nc-cat" value="${esc(c.category)}" spellcheck="false" autocomplete="off" placeholder="N, V, DEM…"></label>
      </div>
      <pre class="log" id="nc-block">${esc(newEntryBlock(c))}</pre>
      <div class="ebtns">
        <a href="#/item" class="muted" data-act="nc-cancel">Cancel</a>
        <span class="spacer"></span>
        <span class="muted" id="nc-problem" style="font-size:12.5px">${esc(problem ?? "")}</span>
        <button data-act="nc-preview" ${problem || c.previewing ? "disabled" : ""}>${c.previewing ? "Previewing…" : "Preview"}</button>
        <button data-act="nc-save" class="primary" ${problem ? "disabled" : ""}>Add entry</button>
      </div>
      <div id="le-out">${previewHtml({ ...c, mode: "create" }, c.id)}</div>
    </div></div>`;
}

// --- Wiring ---------------------------------------------------------------------------

// Inputs update the edit without re-rendering, so typing keeps focus.
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (L.edit && ["le-form", "le-gloss", "le-yaml"].includes(t.id)) {
    L.edit[t.id.slice(3)] = t.value;
    const d = document.querySelector(".editcard .dirty");
    if (d) d.textContent = editDirty() ? "● unsaved" : "";
    const save = document.querySelector('[data-act="save"]');
    if (save) save.disabled = !editDirty();
    const cancel = document.querySelector('[data-act="cancel"]');
    if (cancel) cancel.textContent = editDirty() ? "Discard" : "Close";
  }
  if (L.create && t.id?.startsWith("nc-")) {
    const k = { "nc-id": "id", "nc-form": "form", "nc-gloss": "gloss", "nc-cat": "category" }[t.id];
    if (k) L.create[k] = t.value.trim();
    $("#nc-block").textContent = newEntryBlock(L.create);
    const problem = createProblem();
    $("#nc-problem").textContent = problem ?? "";
    document.querySelector('[data-act="nc-preview"]').disabled = !!problem;
    document.querySelector('[data-act="nc-save"]').disabled = !!problem;
  }
});
document.addEventListener("change", (ev) => {
  if (ev.target.id === "nc-file" && L.create) {
    L.create.file = ev.target.value;
    L.create.base = srcText(ev.target.value);
    $("#nc-block").textContent = newEntryBlock(L.create);
  }
});

// Edits and previews also run through the generic editing shortcuts.
function lexShortcut(e) {
  const k = e.key === "s" ? "save" : e.key === "Enter" ? "preview" : null;
  if (!k || !(e.metaKey || e.ctrlKey)) return false;
  if (location.hash.startsWith("#/new") && L.create) { e.preventDefault(); lexAction("nc-" + k); return true; }
  if (location.hash.startsWith("#/item") && L.edit) { e.preventDefault(); lexAction(k); return true; }
  return false;
}

async function lexAction(act) {
  const e = L.edit, c = L.create;
  switch (act) {
    case "new": L.create = null; return startCreate();
    case "edit": return startEdit(currentItem());
    case "edit-yaml": return startEdit(currentItem(), "yaml");
    case "delete":
      await startEdit(currentItem(), "delete");
      return L.edit?.loc && previewEdit(L.edit, L.edit.loc.file);
    case "mode-fields": case "mode-yaml":
      if (e) {
        // Carry the edit across: fields → YAML shows the edited block.
        if (act === "mode-yaml" && e.mode === "fields") {
          const lines = editedText(e).split("\n");
          const delta = lines.length - e.base.split("\n").length;
          e.yaml = lines.slice(e.loc.start, e.loc.end + delta).join("\n");
        } else if (act === "mode-fields" && e.mode === "yaml" && editDirty(e)) {
          if (!confirm("Switching back drops your YAML edits. Continue?")) return;
          e.yaml = e.base.split("\n").slice(e.loc.start, e.loc.end).join("\n");
        }
        e.mode = act.slice(5);
        e.preview = null;
        route();
      }
      return;
    case "cancel":
      if (e && e.mode !== "delete" && editDirty() && !confirm("Discard your changes to this entry?")) return;
      L.edit = null;
      return route();
    case "preview": return e?.loc && previewEdit(e, e.loc.file);
    case "save": return e?.loc && editDirty() && saveEdit(e, e.loc.file, () => {
      if (e.mode === "delete") history.replaceState(null, "", "#/item");
      L.edit = null;
    });
    case "nc-preview": return c && !createProblem() && previewEdit(Object.assign(c, { mode: "create" }), c.file);
    case "nc-save":
      if (!c || createProblem()) return;
      return saveEdit(Object.assign(c, { mode: "create" }), c.file, () => {
        const id = c.id;
        L.create = null;
        history.replaceState(null, "", href(id));
      });
    case "nc-cancel": L.create = null; return;
  }
}

function currentItem() {
  const m = location.hash.match(/^#\/item\/(.+)$/);
  return m ? decodeURIComponent(m[1]) : null;
}

document.addEventListener("click", (ev) => {
  const a = ev.target.closest("[data-act]");
  if (!a) return;
  if (a.tagName === "A" && a.dataset.act !== "nc-cancel") ev.preventDefault();
  lexAction(a.dataset.act);
});

window.addEventListener("beforeunload", (e) => {
  if ((editDirty() && L.edit.mode !== "delete") || (L.create && (L.create.id || L.create.form.length > 1))) { e.preventDefault(); e.returnValue = ""; }
});

// ---------------------------------------------------------------------------
// Deleting stages and rules files. Each delete is planned here as a set of
// file changes (family.yaml edited line by line, rules files trimmed or
// removed), previewed by building a copy, and applied only if that build
// succeeds and the files are unchanged on disk (/api/changeset).

const familyFile = () => L.sources.find((s) => /^family\.ya?ml$/.test(s.file))?.file ?? "family.yaml";

// A stage's block in family.yaml: lines [head, end), where head takes in the
// comment lines directly above its key (they describe it).
function stageBlock(text, id) {
  const lines = text.split("\n");
  const top = lines.findIndex((l) => /^stages\s*:\s*(#.*)?$/.test(l));
  if (top < 0) return null;
  const key = new RegExp(`^(\\s+)(["']?)${reEsc(id)}\\2\\s*:\\s*(#.*)?$`);
  let child = null;
  for (let i = top + 1; i < lines.length; i++) {
    const l = lines[i];
    if (l.trim() && !/^\s/.test(l) && !l.startsWith("#")) break;
    if (blankOrComment(l)) continue;
    child ??= indentOf(l);
    if (indentOf(l) !== child || !key.test(l)) continue;
    let end = i + 1, keyIndent = null;
    for (let k = i + 1; k < lines.length; k++) {
      if (blankOrComment(lines[k])) continue;
      if (indentOf(lines[k]) <= child) break;
      keyIndent ??= indentOf(lines[k]);
      end = k + 1;
    }
    let head = i;
    while (head - 1 > top && lines[head - 1].trim().startsWith("#") && indentOf(lines[head - 1]) >= child) head--;
    return { head, start: i, end, keyIndent: keyIndent ?? child + 2 };
  }
  return null;
}

function removeStageBlock(text, id) {
  const b = stageBlock(text, id);
  if (!b) throw new Error(`couldn't find stage ${id} in family.yaml`);
  const lines = text.split("\n");
  let { head, end } = b;
  // Take one neighbouring blank line too, so no double gap is left.
  if (head > 0 && !lines[head - 1].trim()) head--;
  else if (end < lines.length && !lines[end].trim()) end++;
  return [...lines.slice(0, head), ...lines.slice(end)].join("\n");
}

function stageKeyLine(lines, b, key) {
  for (let k = b.start + 1; k < b.end; k++)
    if (indentOf(lines[k]) === b.keyIndent && new RegExp(`^\\s*${reEsc(key)}\\s*:`).test(lines[k])) return k;
  return -1;
}

function removeStageKey(text, id, key) {
  const lines = text.split("\n");
  const b = stageBlock(text, id);
  const k = b ? stageKeyLine(lines, b, key) : -1;
  if (k >= 0) lines.splice(k, 1);
  return lines.join("\n");
}

// Set key: value in a stage, keeping a trailing comment; bare if the value
// is a plain slug, else quoted.
function setStageKey(text, id, key, value, quote = false) {
  const lines = text.split("\n");
  const b = stageBlock(text, id);
  if (!b) throw new Error(`couldn't find stage ${id} in family.yaml`);
  const v = !quote && /^[A-Za-z0-9_.-]+$/.test(value) ? value : JSON.stringify(value);
  const k = stageKeyLine(lines, b, key);
  if (k >= 0) {
    const { comment } = splitValue(lines[k].replace(/^[^:]*:/, ""));
    lines[k] = " ".repeat(b.keyIndent) + `${key}: ${v}` + (comment ? "   " + comment : "");
  } else {
    const p = stageKeyLine(lines, b, "parent");
    lines.splice((p >= 0 ? p : b.start) + 1, 0, " ".repeat(b.keyIndent) + `${key}: ${v}`);
  }
  return lines.join("\n");
}

// A rules file without segment n (1-based) and one of the report lines
// beside it. Categories blocks in the segment are kept, since later
// segments may use them (Brassica keeps them in force across reports).
function removeSegment(text, n) {
  const lines = text.split("\n");
  const w = segmentWindow(text, n);
  if (!w) return text;
  const end = lines.length - w.tail;
  const hasAfter = end < lines.length;     // a report line follows
  const from = hasAfter ? w.start : Math.max(0, w.start - 1);
  const to = hasAfter ? end + 1 : end;
  const keep = [];
  let inCats = false;
  for (const l of lines.slice(w.start, end)) {
    const t = stripComment(l);
    if (/^(new\s+)?categories\b/.test(t)) inCats = true;
    if (inCats) keep.push(l);
    if (inCats && t === "end") { inCats = false; keep.push(""); }
  }
  return [...lines.slice(0, from), ...keep, ...lines.slice(to)].join("\n");
}

const descendants = (id) => (IX.children.get(id) || []).flatMap((c) => [c, ...descendants(c)]);

// What still points at stages that are going: entries formed there, and
// category, fate and repattern records at them. (Events, expectations and
// paradigm stages aren't in lexicon.json; the preview build catches those.)
function stageReferences(gone) {
  const refs = [];
  for (const it of Object.values(S.lex.items)) {
    if (it.kind === "cell") continue;
    const why = [];
    if (gone.has(it.formed)) why.push("formed there");
    if (it.category.some((c) => gone.has(c.at))) why.push("category");
    if (Object.keys(it.fate || {}).some((s) => gone.has(s))) why.push("fate");
    if (it.repatterns.some((r) => gone.has(r.at))) why.push("repattern");
    if (why.length) refs.push({ id: it.id, why });
  }
  return refs;
}

// --- Plans ----------------------------------------------------------------------

// Delete a whole rules file, and unhook the stages that use it.
function planDeleteFile(file) {
  const fam = familyFile();
  let text = srcText(fam);
  const users = stagesUsing(S.lex, file);
  for (const u of users) text = removeStageKey(text, u.stage, u.role);
  const notes = [`Deletes <span class="mono">${esc(file)}</span>.`];
  for (const u of users) notes.push(`${esc(stageName(u.stage))} loses its ${u.role === "rules" ? "sound changes" : "spelling rules"}; ${
    u.role === "rules" ? "its forms will be copied unchanged from " + esc(stageName(IX.stages.get(u.stage).parent ?? "")) : "its forms will be unspelled"}.`);
  return { writes: users.length ? { [fam]: text } : {}, deletes: [file], notes, gone: new Set() };
}

// Delete a stage, with options for its daughters and its rules.
function planDeleteStage(id, opts) {
  const st = IX.stages.get(id);
  const fam = familyFile();
  let text = srcText(fam);
  const gone = new Set([id, ...(opts.daughters === "delete" ? descendants(id) : [])]);
  const notes = [];
  const writes = {}, deletes = [];
  const kept = S.lex.stages.filter((s) => !gone.has(s.id));

  // Rules belonging to the stages that go.
  const files = new Map();          // file → new text
  const segsGone = new Map();       // file → [segment numbers removed]
  for (const g of gone) {
    const gs = IX.stages.get(g);
    for (const role of ["rules", "orthography"]) {
      const ref = parseRef(gs[role]);
      if (!ref) continue;
      const stillUsed = kept.some((s) => parseRef(s.rules)?.file === ref.file || parseRef(s.orthography)?.file === ref.file);
      if (opts.rules === "remove" && deletes.includes(ref.file)) continue;   // already going
      if (opts.rules === "remove" && ref.seg == null && !stillUsed) {
        deletes.push(ref.file);
        notes.push(`Deletes <span class="mono">${esc(ref.file)}</span>.`);
      } else if (opts.rules === "remove" && ref.seg != null && !stillUsed && !deletes.includes(ref.file)) {
        deletes.push(ref.file);
        notes.push(`Deletes <span class="mono">${esc(ref.file)}</span> (no remaining stage uses it).`);
      } else if (opts.rules === "remove" && ref.seg != null) {
        if (!segsGone.has(ref.file)) segsGone.set(ref.file, []);
        segsGone.get(ref.file).push(ref.seg);
      } else {
        notes.push(`Leaves <span class="mono">${esc(gs[role])}</span> in place, unused${ref.seg != null ? " (a segment no stage points at)" : ""}.`);
      }
    }
  }
  // Cut segments, last first, and renumber the references after them.
  for (const [file, segs] of segsGone) {
    let t = textOf(file);
    const sorted = [...new Set(segs)].sort((a, b) => b - a);
    for (const n of sorted) t = removeSegment(t, n);
    files.set(file, t);
    notes.push(`Removes segment${sorted.length > 1 ? "s" : ""} ${sorted.slice().reverse().join(", ")} of <span class="mono">${esc(file)}</span>.`);
    for (const s of kept) for (const role of ["rules", "orthography"]) {
      const ref = parseRef(s[role]);
      if (ref?.file !== file || ref.seg == null) continue;
      const shift = sorted.filter((n) => n < ref.seg).length;
      if (shift) {
        text = setStageKey(text, s.id, role, `${file}#${ref.seg - shift}`, true);
        notes.push(`${esc(s.name)} now points at <span class="mono">${esc(file)}#${ref.seg - shift}</span> (was #${ref.seg}).`);
      }
    }
  }

  // Daughters.
  const kids = IX.children.get(id) || [];
  if (kids.length && opts.daughters === "reattach") {
    for (const k of kids) {
      if (st.parent) text = setStageKey(text, k, "parent", st.parent);
      else text = removeStageKey(text, k, "parent");
    }
    notes.push(`${kids.map((k) => esc(stageName(k))).join(", ")} will descend directly from ${esc(st.parent ? stageName(st.parent) : "nothing (becoming roots)")}, skipping ${esc(st.name)}'s changes.`);
  } else if (kids.length) {
    notes.push(`Also deletes ${[...gone].filter((g) => g !== id).map((g) => esc(stageName(g))).join(", ")}.`);
  }

  for (const g of gone) text = removeStageBlock(text, g);
  writes[fam] = text;
  for (const [f, t] of files) writes[f] = t;
  notes.unshift(`Removes ${esc(st.name)} from <span class="mono">${esc(fam)}</span>.`);
  return { writes, deletes, notes, gone };
}

// --- The dialog -------------------------------------------------------------------

const M = { open: null };   // {kind, target, opts, plan, preview, previewing, error}

async function openDelete(kind, target) {
  // Plans are made from the build's picture of the family, so it must
  // match the files on disk.
  const st = await (await fetch("api/status", { cache: "no-store" })).json();
  if (st.built == null || st.inputs > st.built) await rebuild({ fromSave: true });
  if (kind === "stage" && !IX.stages.has(target)) return;
  await loadSources();
  await loadRules();
  M.open = { kind, target, opts: { daughters: "reattach", rules: "remove" }, preview: null, previewing: false, error: null };
  replan();
}

function replan() {
  const m = M.open;
  m.error = null;
  m.preview = null;
  try {
    m.plan = m.kind === "file" ? planDeleteFile(m.target) : planDeleteStage(m.target, m.opts);
    const touched = [...Object.keys(m.plan.writes), ...m.plan.deletes].filter((f) => f.endsWith(".bsc"));
    const unsaved = touched.filter((f) => isDirty(f));
    if (unsaved.length) throw new Error(`Save or revert your unsaved edits to ${unsaved.join(", ")} first.`);
  } catch (e) { m.plan = null; m.error = e.message; }
  renderModal();
  if (m.plan) runChangeset(false);
}

function changesetBody(apply) {
  const p = M.open.plan;
  const expect = {};
  for (const f of [...Object.keys(p.writes), ...p.deletes])
    expect[f] = f.endsWith(".bsc") ? savedText(f) : srcText(f);
  return JSON.stringify({ writes: p.writes, deletes: p.deletes, expect, apply });
}

async function runChangeset(apply) {
  const m = M.open;
  m.previewing = true;
  renderModal();
  try {
    const r = await fetch("api/changeset", { method: "POST", body: changesetBody(apply) });
    const res = expandResult(await r.json());
    if (!r.ok) throw new Error(res.error || r.status);
    m.preview = res;
    if (apply && res.applied) {
      const { kind, target } = m;
      const parent = kind === "stage" ? IX.stages.get(target).parent : null;
      for (const f of m.plan.deletes) R.drafts.delete(f);
      M.open = null;
      renderModal();
      await loadSources();
      await loadRules();
      R.mounted = null;
      history.replaceState(null, "", kind === "stage" && parent ? "#/rules/" + encodeURIComponent(parent) : "#/rules");
      await rebuild({ fromSave: true });
      return;
    }
  } catch (e) { m.error = e.message; }
  if (M.open) { m.previewing = false; renderModal(); }
}

// Lines that differ between two texts, as - and + lines with a little
// context. A patience diff: lines that occur once in each text anchor the
// alignment, so repeated lines (parent: western-romance) don't pair up wrongly.
function diffOps(x, y) {
  let p = 0;
  while (p < x.length && p < y.length && x[p] === y[p]) p++;
  let q = 0;
  while (q < x.length - p && q < y.length - p && x[x.length - 1 - q] === y[y.length - 1 - q]) q++;
  const head = x.slice(0, p).map((l) => [" ", l]), tail = x.slice(x.length - q).map((l) => [" ", l]);
  const xs = x.slice(p, x.length - q), ys = y.slice(p, y.length - q);
  if (!xs.length || !ys.length) return [...head, ...xs.map((l) => ["-", l]), ...ys.map((l) => ["+", l]), ...tail];
  const count = (arr) => arr.reduce((m, l, i) => m.set(l, m.has(l) ? -1 : i), new Map());
  const cx = count(xs), cy = count(ys);
  const pairs = [...cx].filter(([l, i]) => i >= 0 && cy.get(l) >= 0).map(([l, i]) => [i, cy.get(l)]).sort((a, b) => a[0] - b[0]);
  // Longest increasing run of y positions among the anchors.
  const tails = [], prev = [];
  pairs.forEach((pr, k) => {
    let lo = 0, hi = tails.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (pairs[tails[mid]][1] < pr[1]) lo = mid + 1; else hi = mid; }
    prev[k] = lo ? tails[lo - 1] : -1;
    tails[lo] = k;
  });
  const anchors = [];
  for (let k = tails.length ? tails[tails.length - 1] : -1; k >= 0; k = prev[k]) anchors.unshift(pairs[k]);
  if (!anchors.length) return [...head, ...lcsOps(xs, ys), ...tail];
  const ops = [];
  let i = 0, j = 0;
  for (const [ai, aj] of anchors) {
    ops.push(...diffOps(xs.slice(i, ai), ys.slice(j, aj)), [" ", xs[ai]]);
    i = ai + 1; j = aj + 1;
  }
  ops.push(...diffOps(xs.slice(i), ys.slice(j)));
  return [...head, ...ops, ...tail];
}

function lcsOps(x, y) {
  const n = x.length, m = y.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = x[i] === y[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = [];
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && x[i] === y[j]) { ops.push([" ", x[i]]); i++; j++; }
    else if (i < n && (j === m || dp[i + 1][j] >= dp[i][j + 1])) { ops.push(["-", x[i]]); i++; }
    else { ops.push(["+", y[j]]); j++; }
  }
  return ops;
}

function lineDiff(a, b) {
  const ops = diffOps(a.split("\n"), b.split("\n"));
  const keep = ops.map((o, k) => o[0] !== " " || ops.slice(Math.max(0, k - 1), k + 2).some((p) => p[0] !== " "));
  let out = "", gap = false;
  ops.forEach((o, k) => {
    if (!keep[k]) { if (!gap) out += `<span class="faint">  ⋮</span>\n`; gap = true; return; }
    gap = false;
    out += `<span class="${o[0] === "-" ? "del" : o[0] === "+" ? "ins" : "faint"}">${o[0]} ${esc(o[1])}</span>\n`;
  });
  return out;
}

function renderModal() {
  let el = $("#modal");
  const m = M.open;
  if (!m) { el?.remove(); return; }
  if (!el) {
    el = document.createElement("div");
    el.id = "modal";
    document.body.appendChild(el);
    el.addEventListener("click", modalClick);
    el.addEventListener("change", modalChange);
  }
  const title = m.kind === "file" ? `Delete ${esc(m.target)}?` : `Delete ${esc(stageName(m.target))}?`;
  let opts = "";
  if (m.kind === "stage") {
    const st = IX.stages.get(m.target);
    const kids = IX.children.get(m.target) || [];
    const hasRules = st.rules || st.orthography || (m.opts.daughters === "delete" && descendants(m.target).some((d) => IX.stages.get(d).rules));
    if (kids.length) opts += `<fieldset><legend>Its daughters (${kids.map((k) => esc(stageName(k))).join(", ")})</legend>
      <label><input type="radio" name="daughters" value="reattach" ${m.opts.daughters === "reattach" ? "checked" : ""}> Attach them to ${esc(st.parent ? stageName(st.parent) : "nothing")}</label>
      <label><input type="radio" name="daughters" value="delete" ${m.opts.daughters === "delete" ? "checked" : ""}> Delete them too (${descendants(m.target).length} stage${descendants(m.target).length === 1 ? "" : "s"})</label></fieldset>`;
    if (hasRules) opts += `<fieldset><legend>Rules</legend>
      <label><input type="radio" name="rules" value="remove" ${m.opts.rules === "remove" ? "checked" : ""}> Remove them (delete the file, or cut the segment and renumber the rest)</label>
      <label><input type="radio" name="rules" value="keep" ${m.opts.rules === "keep" ? "checked" : ""}> Keep the rules files as they are</label></fieldset>`;
  }
  let body = "";
  if (m.error) body += `<div class="box bad" style="white-space:pre-wrap">${esc(m.error)}</div>`;
  if (m.plan) {
    body += `<ul class="notes-list">${m.plan.notes.map((n) => `<li>${n}</li>`).join("")}</ul>`;
    const refs = stageReferences(m.plan.gone);
    if (refs.length) body += `<div class="box warn">Entries still refer to ${m.plan.gone.size === 1 ? "this stage" : "these stages"}: ${refs.map((r) =>
      `${linkId(r.id)} <span class="faint">(${r.why.join(", ")})</span>`).join(", ")}. Change them first, or the project won't build and the delete is refused.</div>`;
    for (const [f, t] of Object.entries(m.plan.writes)) {
      const before = f.endsWith(".bsc") ? savedText(f) : srcText(f);
      body += `<details ${f.endsWith(".bsc") ? "" : "open"}><summary class="mono" style="font-size:12.5px">${esc(f)}</summary><pre class="log diff">${lineDiff(before, t)}</pre></details>`;
    }
    if (m.previewing) body += `<p class="muted">Building a copy of the project…</p>`;
    else if (m.preview) {
      const r = m.preview;
      if (!r.lexicon) body += `<div class="box bad">The project wouldn't build after this, so it can't be deleted yet.</div><pre class="log">${esc(r.stderr)}</pre>`;
      else {
        const { fresh, old } = splitMismatches(r);
        const n = r.diff?.length ?? 0;
        const goneN = (r.diff || []).filter((l) => /: gone \(was /.test(l)).length;
        body += `<div class="box ${fresh.length ? "bad" : "warn"}">${n ? [goneN && `${goneN} form${goneN === 1 ? "" : "s"} removed`, n - goneN && `${n - goneN} form${n - goneN === 1 ? "" : "s"} changed`].filter(Boolean).join(", ") : "No forms change"}${fresh.length
          ? `, ${fresh.length} new expectation mismatch${fresh.length === 1 ? "" : "es"}` : ""}${old.length ? ` <span class="muted">(${old.length} already failing)</span>` : ""}</div>`;
        const changed = (r.diff || []).filter((l) => !/: gone \(was /.test(l));
        if (changed.length) body += `<details><summary class="muted">${changed.length} changed form${changed.length === 1 ? "" : "s"}</summary><ul class="plain">${changed.slice(0, 300).map((l) => `<li>${linkDiffLine(l)}</li>`).join("")}</ul></details>`;
        if (fresh.length) body += `<ul class="plain">${fresh.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
      }
    }
  }
  const ok = m.plan && m.preview?.lexicon && !m.previewing;
  el.innerHTML = `<div class="modal-back" data-m="cancel"></div>
    <div class="modal" role="dialog" aria-modal="true" aria-label="${title}">
      <h2 style="font-size:22px;margin-bottom:10px">${title}</h2>
      ${opts}${body}
      <div class="ebtns">
        <button data-m="cancel">Cancel</button>
        <span class="spacer"></span>
        <button data-m="apply" class="danger-solid" ${ok ? "" : "disabled"}>Delete</button>
      </div>
    </div>`;
}

function modalClick(e) {
  const act = e.target.closest("[data-m]")?.dataset.m;
  if (act === "cancel") { M.open = null; renderModal(); }
  else if (act === "apply" && M.open?.plan && M.open.preview?.lexicon) runChangeset(true);
}

function modalChange(e) {
  if (!M.open || e.target.type !== "radio") return;
  M.open.opts[e.target.name] = e.target.value;
  replan();
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && M.open) { M.open = null; renderModal(); }
});

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-del]");
  if (b) openDelete(b.dataset.del, b.dataset.target);
});

// ---------------------------------------------------------------------------
// Events

window.addEventListener("hashchange", route);
$("#stage").addEventListener("change", (e) => {
  S.stage = e.target.value;
  if (location.hash.startsWith("#/rules")) location.hash = "#/rules/" + encodeURIComponent(S.stage);
  else route();
});
$("#q").addEventListener("input", (e) => {
  S.query = e.target.value;
  const cur = location.hash.match(/^#\/item\/(.+)$/);
  renderList(cur ? decodeURIComponent(cur[1]) : null);
});
$("#q").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { const a = $("#list a"); if (a) location.hash = a.getAttribute("href"); }
  if (e.key === "Escape") { e.target.value = ""; S.query = ""; route(); }
});
$("#kinds").addEventListener("click", (e) => {
  const k = e.target.dataset?.kind;
  if (!k) return;
  S.kinds.has(k) ? S.kinds.delete(k) : S.kinds.add(k);
  renderKinds();
  route();
});
$("#view").addEventListener("click", (e) => {
  const row = e.target.closest("tr.stage");
  if (!row || e.target.closest("a")) return;
  const k = row.dataset.key;
  S.open.has(k) ? S.open.delete(k) : S.open.add(k);
  route();
});
$("#rebuild").addEventListener("click", () => rebuild());
$("#openfile").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", (e) => { if (e.target.files[0]) readFile(e.target.files[0]); });
document.addEventListener("keydown", (e) => {
  if (lexShortcut(e)) return;
  const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
  if (location.hash.startsWith("#/rules") && (e.metaKey || e.ctrlKey)) {
    if (e.key === "s") { e.preventDefault(); return saveRules(); }
    if (e.key === "Enter") { e.preventDefault(); return previewRules(); }
  }
  if (e.key === "/" && !typing) { e.preventDefault(); location.hash.startsWith("#/item") || (location.hash = "#/item"); $("#q").focus(); }
  if ((e.metaKey || e.ctrlKey) && e.key === "b" && S.live && !S.building) { e.preventDefault(); rebuild(); }
  if (typing) return;
  if ((e.key === "j" || e.key === "k") && location.hash.startsWith("#/item")) {
    const links = [...document.querySelectorAll("#list a")];
    const i = links.findIndex((a) => a.classList.contains("sel"));
    const n = links[Math.max(0, Math.min(links.length - 1, i + (e.key === "j" ? 1 : -1)))];
    if (n) location.hash = n.getAttribute("href");
  }
});
document.addEventListener("dragover", (e) => { e.preventDefault(); $("#drop")?.classList.add("over"); });
document.addEventListener("dragleave", () => $("#drop")?.classList.remove("over"));
document.addEventListener("drop", (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) readFile(f); });

boot();
</script>
</body>
</html>
