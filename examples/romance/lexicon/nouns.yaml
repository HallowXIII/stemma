# Expected forms are from attested.tsv, which gives sources. Old French
# oblique forms are the ACC cells.

- id: murus
  form: "*mūr-"
  gloss: "wall"
  category: [{ at: latin, is: "N" }]
  paradigm: noun-o
  expect:
    old-spanish: { ACC.SG: múɾo, ACC.PL: múɾos }
    spanish:     { ACC.SG: múɾo, ACC.PL: múɾos }
    old-french:  { NOM.SG: myrs, ACC.SG: myr, NOM.PL: myr, ACC.PL: myrs }
    french:      { ACC.SG: myʁ, ACC.PL: myʁ }

- id: terra
  form: "*terr-"
  gloss: "earth, land"
  category: [{ at: latin, is: "N" }]
  paradigm: noun-a
  expect:
    old-spanish: { ACC.SG: tjéra, ACC.PL: tjéras }
    spanish:     { ACC.SG: tjéra, ACC.PL: tjéras }
    old-french:  { NOM.SG: tɛrrə, ACC.SG: tɛrrə, NOM.PL: tɛrrəs, ACC.PL: tɛrrəs }
    french:      { ACC.SG: tɛʁ, ACC.PL: tɛʁ }

- id: capra
  form: "*kapr-"
  gloss: "goat"
  category: [{ at: latin, is: "N" }]
  paradigm: noun-a
  expect:
    old-spanish: { ACC.SG: kábɾa, ACC.PL: kábɾas }
    spanish:     { ACC.SG: kábɾa, ACC.PL: kábɾas }
    old-french:  { NOM.SG: tʃjevrə, ACC.SG: tʃjevrə, NOM.PL: tʃjevrəs, ACC.PL: tʃjevrəs }
    french:      { ACC.SG: ʃɛvʁ, ACC.PL: ʃɛvʁ }

# The oblique stem has to be an item of its own, since a cell can't be
# given a written stem (FINDINGS.md).
- id: homin
  form: "*homin-"
  gloss: "oblique stem of homō"

- id: homo
  form: "*homō"
  gloss: "man, person"
  category: [{ at: latin, is: "N" }]
  paradigm: noun-c
  cells:
    ACC.SG: { base: homin }
    GEN.SG: { base: homin }
    NOM.PL: { base: homin }
    ACC.PL: { base: homin }
    GEN.PL: { base: homin }
  events:
    # Castilian omne, without the diphthong of Leonese uemne.
    - analogy: { at: old-spanish, cell: ACC.SG, replace: { ɔ́: ó }, model: "unstressed use" }
    - analogy: { at: old-spanish, cell: ACC.PL, replace: { ɔ́: ó }, model: "unstressed use" }
  expect:
    old-spanish: { ACC.SG: ómne, ACC.PL: ómnes }
    spanish:     { ACC.SG: ómbɾe, ACC.PL: ómbɾes }
    old-french:  { NOM.SG: ɔm, ACC.SG: ɔmə, NOM.PL: ɔmə, ACC.PL: ɔməs }
    french:      { ACC.SG: ɔm, ACC.PL: ɔm }
  notes: |
    Old French {homo.NOM.SG @ old-french} is the cas sujet, lost in French
    but kept as the pronoun {on @ french}. The nominative plural
    {homo.NOM.PL @ old-french} is from Vulgar Latin *homini.
  derivatives:
    - id: "on"
      source: { base: homo, cell: NOM.SG }
      stage: western-romance
      gloss: "one (indefinite pronoun)"
      category: [{ at: western-romance, is: PRON }]
      fate: { old-spanish: lost }
      expect: { old-french: ɔm, french: ɔ̃ }
      notes: |
        Already pronominal in the Oaths of Strasbourg (842, "si cum om").
