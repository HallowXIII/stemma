# A Greek loan: OF prestre continues the Latin stress of the nominative,
# provoire the Greek one of the oblique (presbýterum).
- id: presbyter
  form: "*presbiter"
  gloss: { latin: "elder, presbyter", western-romance: "priest" }
  category: [{ at: latin, is: "N" }]
  paradigm: noun-o
  cells:
    NOM.SG: ~
    # French prêtre continues the cas sujet, and its plural is remade on it
    SG: { at: french, continues: NOM.SG }
