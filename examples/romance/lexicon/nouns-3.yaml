# A Greek loan: OF prestre continues the Latin stress of the nominative,
# provoire the Greek one of the oblique (presbýterum).
- id: presbyter
  form: "*presbiter"
  gloss: "elder; priest"
  category: [{ at: latin, is: "N" }]
  paradigm: noun-o
  cells:
    NOM.SG: ~
    # French prêtre continues the cas sujet
    ACC.SG: { at: french, base: presbyter.NOM.SG, morph: ~ }
    ACC.PL: { at: french, base: presbyter.NOM.SG, morph: ~ }
  expect:
    old-french: { NOM.SG: prɛstrə, ACC.SG: provojrə, NOM.PL: provojrə, ACC.PL: provojrəs }
    french: { ACC.SG: pʁɛtʁ, ACC.PL: pʁɛtʁ }
  derivatives:
    # Spanish preste, from Old French
    - id: preste
