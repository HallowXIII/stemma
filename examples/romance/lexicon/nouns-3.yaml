# Third-declension nouns. Expected forms are generated from attested.tsv
# by research/expect.sh, which gives sources. The nominative singular is
# the entry's form; the other cells are built on the oblique stem.

- id: homo
  form: "*homō"
  gloss: "man, person"
  category: [{ at: latin, is: "N" }]
  paradigm: noun-c
  properties: { gender: m }
  cells:
    ACC.SG: { stem: "*homin-" }
    GEN.SG: { stem: "*homin-" }
    NOM.PL: { stem: "*homin-" }
    ACC.PL: { stem: "*homin-" }
    GEN.PL: { stem: "*homin-" }
  events:
    # Castilian omne and Francien om, ome, without the diphthong of Leonese
    # uemne and OF huem: the word was often unstressed.
    - analogy: { at: ibero-romance, replace: { ɔ́: ó }, model: "unstressed use" }
    - analogy: { at: old-french, replace: { ɔ́: ɔ }, model: "unstressed use" }
    # omne beside nombre (both by 1200), though mn > mbr is one change
    # (Lloyd): probably the old spelling of a frequent word, often
    # abbreviated ome with a tilde, rather than a later sound change
    - irregular: { at: old-spanish, cell: SG, form: "ómne", reason: "conservative spelling, beside nombre" }
    - irregular: { at: old-spanish, cell: PL, form: "ómnes", reason: "conservative spelling, beside nombres" }
  expect:
    old-spanish: { SG: ómne, PL: ómnes }
    spanish: { SG: ómbɾe, PL: ómbɾes }
    old-french: { NOM.SG: ɔm, ACC.SG: ɔmə, NOM.PL: ɔmə, ACC.PL: ɔməs }
    french: { SG: ɔm, PL: ɔm }
  notes:
    old-french: |
      Old French {homo.NOM.SG @ old-french} is the cas sujet, lost in French
      but kept as the pronoun {on @ french}. The nominative plural
      {homo.NOM.PL @ old-french} is from Vulgar Latin *homini.
  derivatives:
    - id: "on"
      source: { base: homo, cell: NOM.SG }
      stage: western-romance
      gloss: "one (indefinite pronoun)"
      category: [{ at: western-romance, is: PRON }]
      fate: { old-spanish: lost }
      events:
        - analogy: { at: old-french, replace: { ɔ́: ɔ }, model: "unstressed use" }
      expect: { old-french: ɔm, french: ɔ̃ }
      notes: |
        Already pronominal in the Oaths of Strasbourg (842, "si cum om").
    # A compound of the Old French accusatives
    - id: bonhomme
      properties: { gender: m }
      source: { compound: [bonus.M.ACC.SG, homo.ACC.SG] }
      stage: old-french
      gloss: "fellow, good man"
      category: [{ at: old-french, is: "N" }]
      expect: { french: bɔnɔm }

