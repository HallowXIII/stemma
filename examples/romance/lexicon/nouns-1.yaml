    spanish: { SG: kábɾa, PL: kábɾas }
    old-french: { NOM.SG: tʃjevrə, ACC.SG: tʃjevrə, NOM.PL: tʃjevrəs, ACC.PL: tʃjevrəs }
    french: { SG: ʃɛvʁ, PL: ʃɛvʁ }

- id: rota
  form: "*rot-"
  gloss: "wheel"
  category: [{ at: latin, is: "N" }]
  paradigm: noun-a
  events:
    # roue /ʁu/, not *reue: after rouer, rouelle
    - analogy: { at: french, replace: { w: "", ɛ: u }, model: "rouer" }
  expect:
    old-spanish: { SG: rwéda, PL: rwédas }
    spanish: { SG: rwéda, PL: rwédas }
    old-french: { NOM.SG: rwɛə, ACC.SG: rwɛə, NOM.PL: rwɛəs, ACC.PL: rwɛəs }
    french: { SG: ʁu, PL: ʁu }

