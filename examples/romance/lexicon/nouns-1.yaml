- id: stella
  form: "*stēll-"
  gloss: "star"
  category: [{ at: latin, is: "N" }]
  paradigm: noun-a
  events:
    # estrella: r from astrum
    - analogy: { at: old-spanish, replace: { t: t r }, model: "astrum" }
    # estoile: from a Gallo-Roman *stēla with a single l
    - irregular: { at: old-french, cell: NOM.SG, form: "estojlə", reason: "Gallo-Roman *stēla" }
    - irregular: { at: old-french, cell: ACC.SG, form: "estojlə", reason: "Gallo-Roman *stēla" }
    - irregular: { at: old-french, cell: NOM.PL, form: "estojləs", reason: "Gallo-Roman *stēla" }
    - irregular: { at: old-french, cell: ACC.PL, form: "estojləs", reason: "Gallo-Roman *stēla" }
  expect:
    old-spanish: { ACC.SG: estɾéʎa, ACC.PL: estɾéʎas }
    spanish: { ACC.SG: estɾéʎa, ACC.PL: estɾéʎas }
    old-french: { NOM.SG: estojlə, ACC.SG: estojlə, NOM.PL: estojləs, ACC.PL: estojləs }
    french: { ACC.SG: etwal, ACC.PL: etwal }

- id: schola
  form: "*skol-"
  gloss: "school"
  category: [{ at: latin, is: "N" }]
  paradigm: noun-a
  events:
    # escole, not *escuele: the vowel of the Latin school word
    - analogy: { at: old-french, replace: { ɔ́: ɔ }, model: "Latin schola" }
  expect:
    old-spanish: { ACC.SG: eskwéla, ACC.PL: eskwélas }
    spanish: { ACC.SG: eskwéla, ACC.PL: eskwélas }
    old-french: { NOM.SG: eskɔlə, ACC.SG: eskɔlə, NOM.PL: eskɔləs, ACC.PL: eskɔləs }
    french: { ACC.SG: ekɔl, ACC.PL: ekɔl }

# The Latin neuter plural of folium, a feminine singular in Vulgar Latin.
- id: folia
  form: "*foli-"
  stage: vulgar-latin
  gloss: "leaf"
  category: [{ at: vulgar-latin, is: "N" }]
  paradigm: noun-a
  expect:
    old-spanish: { ACC.SG: fóʒa, ACC.PL: fóʒas }
    spanish: { ACC.SG: óxa, ACC.PL: óxas }
    old-french: { NOM.SG: fwɛʎə, ACC.SG: fwɛʎə, NOM.PL: fwɛʎəs, ACC.PL: fwɛʎəs }
    french: { ACC.SG: fœj, ACC.PL: fœj }

# Replacements for caput 'head'.
- id: capitia
  form: "*kapiti-"
  stage: vulgar-latin
  gloss: "head (Spanish)"
  category: [{ at: vulgar-latin, is: "N" }]
  paradigm: noun-a
  fate: { old-french: lost }
  expect:
    old-spanish: { ACC.SG: kabétsa, ACC.PL: kabétsas }
    spanish: { ACC.SG: kabéθa, ACC.PL: kabéθas }
  notes: |
    Spanish {capitia @ spanish} 'head' leaves {caput @ spanish} to mean
    'end, cape'.

- id: testa
  form: "*test-"
  gloss: "pot, shell; head (French)"
  category: [{ at: latin, is: "N" }]
  paradigm: noun-a
  fate: { old-spanish: lost }
  expect:
    french: { ACC.SG: tɛt, ACC.PL: tɛt }
  notes: |
    French {testa @ french} 'head' leaves {caput @ french} to mean 'chief'.
