- id: stella
  form: "*stēll-"
  gloss: "star"
  category: [{ at: latin, is: "N" }]
  paradigm: noun-a
  events:
    # estrella: r from astrum
    - analogy: { at: old-spanish, replace: { t: t r }, model: "astrum" }
    # estoile: from a Gallo-Roman *stēla with a single l
    - analogy: { at: gallo-romance, rule: "l l / l / _", model: "Gallo-Roman *stēla" }
  expect:
    old-spanish: { SG: estɾéʎa, PL: estɾéʎas }
    spanish: { SG: estɾéʎa, PL: estɾéʎas }
    old-french: { NOM.SG: estojlə, ACC.SG: estojlə, NOM.PL: estojləs, ACC.PL: estojləs }
    french: { SG: etwal, PL: etwal }

- id: schola
  form: "*skol-"
  gloss: "school"
  category: [{ at: latin, is: "N" }]
  paradigm: noun-a
  events:
    # escole, not *escuele: the vowel of the Latin school word
    - analogy: { at: old-french, replace: { ɔ́: ɔ }, model: "Latin schola" }
  expect:
    old-spanish: { SG: eskwéla, PL: eskwélas }
    spanish: { SG: eskwéla, PL: eskwélas }
    old-french: { NOM.SG: eskɔlə, ACC.SG: eskɔlə, NOM.PL: eskɔləs, ACC.PL: eskɔləs }
    french: { SG: ekɔl, PL: ekɔl }

# The Latin neuter plural of folium, a feminine singular in Vulgar Latin.
- id: folia
  form: "*foli-"
  stage: vulgar-latin
  gloss: { vulgar-latin: "leaves", western-romance: "leaf" }
  category: [{ at: vulgar-latin, is: "N" }]
  paradigm: noun-a
  expect:
    old-spanish: { SG: fóʒa, PL: fóʒas }
    spanish: { SG: óxa, PL: óxas }
    old-french: { NOM.SG: fwɛʎə, ACC.SG: fwɛʎə, NOM.PL: fwɛʎəs, ACC.PL: fwɛʎəs }
    french: { SG: fœj, PL: fœj }

# Replacements for caput 'head'.
- id: capitia
  form: "*kapiti-"
  stage: vulgar-latin
  gloss: "head"
  category: [{ at: vulgar-latin, is: "N" }]
  paradigm: noun-a
  fate: { old-french: lost }
  expect:
    old-spanish: { SG: kabétsa, PL: kabétsas }
    spanish: { SG: kabéθa, PL: kabéθas }
  notes: |
    Spanish {capitia @ spanish} 'head' leaves {caput @ spanish} to mean
    'end, cape'.

- id: testa
  form: "*test-"
  gloss: { latin: "pot, shell", gallo-romance: "head" }
  category: [{ at: latin, is: "N" }]
  paradigm: noun-a
  fate: { old-spanish: lost }
  expect:
    french: { SG: tɛt, PL: tɛt }
  notes: |
    French {testa @ french} 'head' leaves {caput @ french} to mean 'chief'.
