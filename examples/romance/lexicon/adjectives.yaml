# Adjectives. Expected forms are generated from attested.tsv by
# research/expect.sh, which gives sources.

- id: plenus
  form: "*plēn-"
  gloss: "full"
  category: [{ at: latin, is: ADJ }]
  paradigm: adj-o-a
  expect:
    old-spanish: { M.ACC.SG: ʎéno, M.ACC.PL: ʎénos, F.ACC.SG: ʎéna, F.ACC.PL: ʎénas }
    spanish: { M.ACC.SG: ʎéno, M.ACC.PL: ʎénos, F.ACC.SG: ʎéna, F.ACC.PL: ʎénas }
    old-french: { M.NOM.SG: plejns, M.ACC.SG: plejn, M.NOM.PL: plejn, M.ACC.PL: plejns, F.ACC.SG: plejnə, F.ACC.PL: plejnəs }
    french: { M.ACC.SG: plɛ̃, M.ACC.PL: plɛ̃, F.ACC.SG: plɛn, F.ACC.PL: plɛn }

- id: fragilis
  form: "*fragil-"
  gloss: "fragile, frail"
  category: [{ at: latin, is: ADJ }]
  paradigm: adj-c
  fate: { old-spanish: lost }
  events:
    # fraile, without -s, like other adjectives in -e
    - analogy: { at: old-french, cell: M.NOM.SG, replace: { s: "" }, model: "adjectives in -e" }
  notes: |
    Inherited in French as {fragilis @ french}, beside learned
    {fragile-fr @ french}. Spanish has only the learned {fragil-es @ spanish}.
  derivatives:
    # Learned borrowings, taken from Latin as written.
    - id: fragile-fr
      source: { loan: { from: latin, id: fragilis.M.ACC.SG, adapt: rules/learned-french.bsc } }
      stage: french
      notes: First attested in 1370.
      expect: { french: fʁaʒil }
    - id: fragil-es
      source: { loan: { from: latin, id: fragilis.M.ACC.SG, adapt: rules/learned-spanish.bsc } }
      stage: spanish
      expect: { spanish: fɾáxil }
  expect:
    old-french: { M.NOM.SG: frajlə, M.ACC.SG: frajlə, M.NOM.PL: frajlə, M.ACC.PL: frajləs, F.ACC.SG: frajlə, F.ACC.PL: frajləs }
    french: { M.ACC.SG: fʁɛl, M.ACC.PL: fʁɛl, F.ACC.SG: fʁɛl, F.ACC.PL: fʁɛl }

- id: bonus
  form: "*bon-"
  gloss: "good"
  category: [{ at: latin, is: ADJ }]
  paradigm: adj-o-a
  events:
    # Francien bon, not buen: unstressed before its noun
    - analogy: { at: old-french, replace: { ɔ́: o }, model: "proclitic use" }
  expect:
    old-spanish: { M.ACC.SG: bwéno, M.ACC.PL: bwénos, F.ACC.SG: bwéna, F.ACC.PL: bwénas }
    spanish: { M.ACC.SG: bwéno, M.ACC.PL: bwénos, F.ACC.SG: bwéna, F.ACC.PL: bwénas }
    old-french: { M.NOM.SG: bons, M.ACC.SG: bon, M.NOM.PL: bon, M.ACC.PL: bons, F.ACC.SG: bonə, F.ACC.PL: bonəs }
    french: { M.ACC.SG: bɔ̃, M.ACC.PL: bɔ̃, F.ACC.SG: bɔn, F.ACC.PL: bɔn }

- id: novus
  form: "*now-"
  gloss: "new"
  category: [{ at: latin, is: ADJ }]
  paradigm: adj-o-a
  cells:
