    old-spanish: { M.ACC.SG: nwéβo, M.ACC.PL: nwéβos, F.ACC.PL: nwéβas }
    spanish: { M.ACC.SG: nwébo, M.ACC.PL: nwébos, F.ACC.SG: nwéba, F.ACC.PL: nwébas }
    old-french: { M.NOM.SG: nwɛs, M.ACC.SG: nwɛf, M.NOM.PL: nwɛf, M.ACC.PL: nwɛs, F.ACC.SG: nwɛvə, F.ACC.PL: nwɛvəs }
    french: { M.ACC.SG: nœf, M.ACC.PL: nœf, F.ACC.SG: nœv, F.ACC.PL: nœv }

