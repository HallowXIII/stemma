  category: [{ at: latin, is: "N" }]
  paradigm: noun-o
  expect:
    old-spanish: { SG: létʃo, PL: létʃos }
    spanish: { SG: létʃo, PL: létʃos }
    old-french: { NOM.SG: lits, ACC.SG: lit, NOM.PL: lit, ACC.PL: lits }
    french: { SG: li, PL: li }

- id: populus
  form: "*popul-"
  gloss: "people"
  category: [{ at: latin, is: "N" }]
  paradigm: noun-o
  events:
    # pueple, not *pueble: p kept under the influence of Latin populus
    - analogy: { at: old-french, replace: { b: p }, model: "Latin populus" }
  expect:
    old-spanish: { SG: pwéblo, PL: pwéblos }
    spanish: { SG: pwéblo, PL: pwéblos }
    old-french: { NOM.SG: pwɛpləs, ACC.SG: pwɛplə, NOM.PL: pwɛplə, ACC.PL: pwɛpləs }
    french: { SG: pœpl, PL: pœpl }

# Vulgar Latin *capum, for caput.
- id: caput
  form: "*kap-"
  stage: vulgar-latin
  gloss: { vulgar-latin: "head", ibero-romance: "end", old-french: "head; chief", french: "chief" }
  category: [{ at: vulgar-latin, is: "N" }]
  paradigm: noun-o
  events:
    # chefs: the plural remade on the singular
    - analogy: { at: french, cell: PL, replace: { s: f }, model: "chef" }
  expect:
    old-spanish: { SG: kábo, PL: kábos }
    spanish: { SG: kábo, PL: kábos }
    old-french: { NOM.SG: tʃjes, ACC.SG: tʃjef, NOM.PL: tʃjef, ACC.PL: tʃjes }
    french: { SG: ʃɛf, PL: ʃɛf }
