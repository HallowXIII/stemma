- id: digitus
  form: "*digit-"
  gloss: "finger"
  category: [{ at: latin, is: "N" }]
  paradigm: noun-o
  expect:
    old-spanish: { SG: dédo, PL: dédos }
    spanish: { SG: dédo, PL: dédos }
    old-french: { NOM.SG: dojts, ACC.SG: dojt, NOM.PL: dojt, ACC.PL: dojts }
    french: { SG: dwa, PL: dwa }

- id: filius
  form: "*fīli-"
  gloss: "son"
  category: [{ at: latin, is: "N" }]
  paradigm: noun-o
  derivatives:
    # The cas sujet, as a word of its own; its s is a spelling
    # pronunciation.
    - id: fils
      properties: { gender: m }
      source: { base: filius, cell: NOM.SG }
      stage: old-french
      gloss: "son"
      events:
        - irregular: { at: french, form: "fis", reason: "spelling pronunciation; fiz gives fi" }
      expect: { french: fis }
  expect:
    old-spanish: { SG: fíʒo, PL: fíʒos }
    spanish: { SG: íxo, PL: íxos }
    old-french: { NOM.SG: fits, ACC.SG: fiʎ, NOM.PL: fiʎ, ACC.PL: fits }

- id: ferrum
  form: "*ferr-"
  gloss: "iron"
  category: [{ at: latin, is: "N" }]
  paradigm: noun-o-n
  expect:
    old-spanish: { SG: fjéro, PL: fjéros }
    spanish: { SG: ʝéro, PL: ʝéros }
    old-french: { NOM.SG: fɛrs, ACC.SG: fɛr, NOM.PL: fɛr, ACC.PL: fɛrs }
    french: { SG: fɛʁ, PL: fɛʁ }

- id: castellum
  form: "*kastell-"
  gloss: { latin: "fort", western-romance: "castle" }
  category: [{ at: latin, is: "N" }]
  paradigm: noun-o-n
  events:
    # château: the singular remade on chasteaus
    - analogy: { at: french, cell: SG, replace: { l: a w }, model: "chasteaus" }
  expect:
    old-spanish: { SG: kastjéʎo, PL: kastjéʎos }
    spanish: { SG: kastíʎo, PL: kastíʎos }
    old-french: { NOM.SG: tʃastɛaws, ACC.SG: tʃastɛl, NOM.PL: tʃastɛl, ACC.PL: tʃastɛaws }
    french: { SG: ʃato, PL: ʃato }

- id: lectus
  form: "*lekt-"
