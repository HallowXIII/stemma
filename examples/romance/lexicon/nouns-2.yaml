    spanish: { SG: áɲo, PL: áɲos }
    old-french: { NOM.SG: ants, ACC.SG: an, NOM.PL: an, ACC.PL: ants }
    french: { SG: ɑ̃, PL: ɑ̃ }

- id: caballus
  form: "*kaball-"
  gloss: { latin: "nag, workhorse", western-romance: "horse" }
  category: [{ at: latin, is: "N" }]
  paradigm: noun-o
  expect:
    old-spanish: { SG: kaβáʎo, PL: kaβáʎos }
    spanish: { SG: kabáʎo, PL: kabáʎos }
    old-french: { NOM.SG: tʃəvaws, ACC.SG: tʃəval, NOM.PL: tʃəval, ACC.PL: tʃəvaws }
    french: { SG: ʃəval, PL: ʃəvo }

- id: oculus
  form: "*okul-"
  gloss: "eye"
  category: [{ at: latin, is: "N" }]
  paradigm: noun-o
