    spanish: { INF: beníɾ, PRS.1SG: béngo, PRS.2SG: bjénes, PRS.3SG: bjéne, PRS.1PL: benímos, PRS.2PL: benís, PRS.3PL: bjénen, FUT.1SG: bendɾé, FUT.3SG: bendɾá, PRET.3SG: bíno, PTCP: benído }
    old-french: { INF: vənir, PRS.1SG: vjeɲ, PRS.2SG: vjens, PRS.3SG: vjent, PRS.1PL: vənons, PRS.2PL: vənets, PRS.3PL: vjenənt, FUT.1SG: vandraj, FUT.3SG: vandra, PRET.3SG: vint, PTCP: vəny }
    french: { INF: vəniʁ, PRS.1SG: vjɛ̃, PRS.2SG: vjɛ̃, PRS.3SG: vjɛ̃, PRS.1PL: vənɔ̃, PRS.2PL: vəne, PRS.3PL: vjɛn, FUT.1SG: vjɛ̃dʁe, FUT.3SG: vjɛ̃dʁa, PRET.3SG: vɛ̃, PTCP: vəny }

- id: mori
  form: "*mor-"
  stage: vulgar-latin
  gloss: "die"
  category: [{ at: vulgar-latin, is: V }]
  paradigm: verb-i
  cells:
    # the u-perfect *morūit, stressed on the ending, which kept its u (OF
    # morut); Spanish murió is weak
    PRET.3SG: [[~, PRET.3SG.UU], { at: ibero-romance, morph: [~, PRET.3SG.I] }, { at: gallo-romance, morph: [~, PRET.3SG.UU] }]
    # Spanish muero, without the yod of *moriō (OF muir keeps it); French
    # meurs, on meurs (2sg), replacing muir
    PRS.1SG: [{ at: ibero-romance, stem: "mɔ́r-", morph: [~, PRS.1SG] }, { at: french, base: mori.PRS.2SG, morph: ~ }]
    # Spanish moriré, remade on the infinitive
    FUT.1SG: { at: spanish, stem: "moɾiɾ-", morph: [~, FUT.1SG] }
    FUT.3SG: { at: spanish, stem: "moɾiɾ-", morph: [~, FUT.3SG] }
    PTCP: { stem: "*mort-", morph: [~, PTCP.S] }
  expect:
    old-spanish: { INF: moɾíɾ, PRS.1SG: mwéɾo, PRS.2SG: mwéɾes, PRS.3SG: mwéɾe, PRS.1PL: moɾímos, PRS.2PL: moɾídes, PRS.3PL: mwéɾen, FUT.1SG: moré, FUT.3SG: morá, PRET.3SG: muɾjó, PTCP: mwéɾto }
    spanish: { INF: moɾíɾ, PRS.1SG: mwéɾo, PRS.2SG: mwéɾes, PRS.3SG: mwéɾe, PRS.1PL: moɾímos, PRS.2PL: moɾís, PRS.3PL: mwéɾen, FUT.1SG: moɾiɾé, FUT.3SG: moɾiɾá, PRET.3SG: muɾjó, PTCP: mwéɾto }
    old-french: { INF: morir, PRS.1SG: myjr, PRS.2SG: mwɛrs, PRS.3SG: mwɛrt, PRS.1PL: morons, PRS.2PL: morets, PRS.3PL: mwɛrənt, FUT.1SG: morraj, FUT.3SG: morra, PRET.3SG: mory, PTCP: mɔrt }
    french: { INF: muʁiʁ, PRS.1SG: mœʁ, PRS.2SG: mœʁ, PRS.3SG: mœʁ, PRS.1PL: muʁɔ̃, PRS.2PL: muʁe, PRS.3PL: mœʁ, FUT.1SG: muʁʁe, FUT.3SG: muʁʁa, PRET.3SG: muʁy, PTCP: mɔʁ }

- id: facere
  form: "*fak-"
  gloss: "do, make"
  category: [{ at: latin, is: V }]
  paradigm: verb-c-s
  cells:
    PRET.3SG: { stem: "*fēk-" }
    PTCP: { stem: "*fakt-" }
    # Spanish hacemos, hacéis, remade on the infinitive
    PRS.1PL: [{ at: spanish, stem: "fadz-", morph: [~, PRS.1PL.E] }, { at: french, stem: "fəz-", morph: [~, PRS.1PL.O] }]
    PRS.2PL: { at: spanish, stem: "fadz-", morph: [~, PRS.2PL.E] }
    # faciō: OF faz; French fais, on fais (2sg), from the 13th century (Pope)
    PRS.1SG: [{ stem: "*faki-" }, { at: french, base: facere.PRS.2SG, morph: ~ }]
  events:
    # the reduced future of Vulgar Latin *fare
    - analogy: { at: gallo-romance, cell: FUT.1SG, replace: { dz: "", e: "", a: ə }, model: "VL *fare" }
    - analogy: { at: gallo-romance, cell: FUT.3SG, replace: { dz: "", e: "", a: ə }, model: "VL *fare" }
    - analogy: { at: ibero-romance, cell: FUT.1SG, replace: { dz: "", e: "" }, model: "VL *fare" }
    - analogy: { at: ibero-romance, cell: FUT.3SG, replace: { dz: "", e: "" }, model: "VL *fare" }
    # OSp femos, feches keep the stress of facimus, facitis, but their
    # syncope came before the palatalisation (kt > ch, as fecho): the rules
    # syncopate later, as in diezmo, plazdo
    - irregular: { at: old-spanish, cell: PRS.1PL, form: "fémos", reason: "early syncope, *fac'mus, with the Latin stress" }
    - irregular: { at: old-spanish, cell: PRS.2PL, form: "fétʃes", reason: "early syncope, *fac'tis, with the Latin stress" }
    # fizo, fist: the i of 1sg fēcī
    - analogy: { at: old-spanish, cell: PRET.3SG, replace: { é: í }, model: "1sg fize" }
    # OF fist: the i of 1sg fis (fēcī, with umlaut), s after dist, mist (Pope)
    - analogy: { at: gallo-romance, cell: PRET.3SG, rule: "é dz / í s / _", model: "1sg fis" }
    # OSp fago, without the yod of faciō, as digo
    - analogy: { at: ibero-romance, cell: PRS.1SG, rule: "dz j o / g o / _ #", model: "digo" }
    # OF font, from *faunt for *facunt, after *aunt, *vaunt (Pope)
    - analogy: { at: gallo-romance, cell: PRS.3PL, rule: "á dz e n t / áu n t / _ #", model: "*aunt, *vaunt" }
  expect:
    old-spanish: { INF: fadzéɾ, PRS.1SG: fágo, PRS.2SG: fádzes, PRS.3SG: fádze, PRS.1PL: fémos, PRS.2PL: fétʃes, PRS.3PL: fádzen, FUT.1SG: faɾé, FUT.3SG: faɾá, PRET.3SG: fídzo, PTCP: fétʃo }
    spanish: { INF: aθéɾ, PRS.1SG: ágo, PRS.2SG: áθes, PRS.3SG: áθe, PRS.1PL: aθémos, PRS.2PL: aθéjs, PRS.3PL: áθen, FUT.1SG: aɾé, FUT.3SG: aɾá, PRET.3SG: íθo, PTCP: étʃo }
    old-french: { INF: fajrə, PRS.1SG: fats, PRS.2SG: fajs, PRS.3SG: fajt, PRS.1PL: fajməs, PRS.2PL: fajtəs, PRS.3PL: font, FUT.1SG: fəraj, FUT.3SG: fəra, PRET.3SG: fist, PTCP: fajt }
    french: { INF: fɛʁ, PRS.1SG: fɛ, PRS.2SG: fɛ, PRS.3SG: fɛ, PRS.1PL: fəzɔ̃, PRS.2PL: fɛt, PRS.3PL: fɔ̃, FUT.1SG: fəʁe, FUT.3SG: fəʁa, PRET.3SG: fi, PTCP: fɛ }

