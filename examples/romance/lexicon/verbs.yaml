- id: cantare
  form: "*kant-"
  gloss: "sing"
  category: [{ at: latin, is: V }]
  paradigm: verb-a
  cells:
    # chant > chante, after verbs with a supporting -e (12th–16th c.)
    PRS.1SG: { at: french, morph: [~, PRS.3SG.A] }
    PRS.1PL: { at: old-french, morph: [~, PRS.1PL.O] }
  expect:
    old-spanish:
      INF: kantáɾ
      PRS.1SG: kánto
      PRS.2SG: kántas
      PRS.3SG: kánta
      PRS.1PL: kantámos
      PRS.2PL: kantádes
      PRS.3PL: kántan
      FUT.1SG: kantaɾé
      FUT.3SG: kantaɾá
    spanish:
      INF: kantáɾ
      PRS.1SG: kánto
      PRS.2SG: kántas
      PRS.3SG: kánta
      PRS.1PL: kantámos
      PRS.2PL: kantájs
      PRS.3PL: kántan
      FUT.1SG: kantaɾé
      FUT.3SG: kantaɾá
    old-french:
      INF: tʃanter
      PRS.1SG: tʃant
      PRS.2SG: tʃantəs
      PRS.3SG: tʃantə
      PRS.1PL: tʃantons
      PRS.2PL: tʃantets
      PRS.3PL: tʃantənt
      FUT.1SG: tʃantəraj
      FUT.3SG: tʃantəra
    french:
      INF: ʃɑ̃te
      PRS.1SG: ʃɑ̃t
      PRS.2SG: ʃɑ̃t
      PRS.3SG: ʃɑ̃t
      PRS.1PL: ʃɑ̃tɔ̃
      PRS.2PL: ʃɑ̃te
      PRS.3PL: ʃɑ̃t
      FUT.1SG: ʃɑ̃tʁe
      FUT.3SG: ʃɑ̃tʁa

- id: amare
  form: "*am-"
  gloss: "love"
  category: [{ at: latin, is: V }]
  paradigm: verb-a
  cells:
    PRS.1SG: { at: french, morph: [~, PRS.3SG.A] }
    PRS.1PL: { at: old-french, morph: [~, PRS.1PL.O] }
    # The stem-stressed aim- is generalised (by Middle French), in the
    # future too.
    FUT.1SG: { at: french, stem: "ajm-", morph: [~, INF.A, FUT.1SG] }
  events:
    - analogy: { at: french, cell: INF, replace: { a: aj }, model: "aime" }
    - analogy: { at: french, cell: PRS.1SG, replace: { a: aj }, model: "aime" }
    - analogy: { at: french, cell: PRS.1PL, replace: { a: aj }, model: "aime" }
    - analogy: { at: french, cell: PRS.2PL, replace: { a: aj }, model: "aime" }
  expect:
    old-spanish:
      { INF: amáɾ, PRS.1SG: ámo, PRS.2SG: ámas, PRS.3SG: áma, PRS.1PL: amámos, PRS.2PL: amádes, PRS.3PL: áman }
    spanish:
      { INF: amáɾ, PRS.1SG: ámo, PRS.2SG: ámas, PRS.3SG: áma, PRS.1PL: amámos, PRS.2PL: amájs, PRS.3PL: áman }
    old-french:
      { INF: amer, PRS.1SG: ajm, PRS.2SG: ajməs, PRS.3SG: ajmə, PRS.1PL: amons, PRS.2PL: amets, PRS.3PL: ajmənt }
    french:
      { INF: eme, PRS.1SG: ɛm, PRS.2SG: ɛm, PRS.3SG: ɛm, PRS.1PL: emɔ̃, PRS.2PL: eme, PRS.3PL: ɛm, FUT.1SG: emʁe }

- id: habere
  form: "*hab-"
  gloss: "have"
  category: [{ at: latin, is: V }]
  paradigm: verb-e
  events:
    # Reduced in auxiliary use, the source of the future endings.
    - irregular: { at: vulgar-latin, cell: PRS.1SG, form: "ájo", reason: "auxiliary reduction" }
    - irregular: { at: vulgar-latin, cell: PRS.3SG, form: "át", reason: "auxiliary reduction" }
  expect:
    old-spanish: { INF: aβéɾ, PRS.1SG: é, PRS.3SG: á }
    spanish:     { INF: abéɾ, PRS.1SG: é, PRS.3SG: á }
    old-french:  { INF: avojr, PRS.1SG: aj, PRS.3SG: a }
    french:      { INF: avwaʁ, PRS.1SG: e, PRS.3SG: a }
