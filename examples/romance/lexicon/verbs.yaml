- id: placere
  form: "*plak-"
  gloss: "please"
  category: [{ at: latin, is: V }]
  paradigm: verb-e
  cells:
    # OF plaisir, on the fourth conjugation
    INF: { at: gallo-romance, morph: [~, INF.I] }
    # the u-perfect placuit (OSp plogo, OF plot); Spanish plació is weak
    PRET.3SG: [[~, PRET.3SG.U], { at: spanish, stem: "pladz-", morph: [~, PRET.3SG.I] }]
    # OSp plazerá, without the syncope of the other futures
    FUT.1SG: { at: old-spanish, stem: "pladzer-", morph: [~, FUT.1SG] }
    FUT.3SG: { at: old-spanish, stem: "pladzer-", morph: [~, FUT.3SG] }
    # OF plaisons, plaisiez, on the stem of plaisir
    PRS.1PL: { at: old-french, stem: "plajdz-", morph: [~, PRS.1PL.O] }
    PRS.2PL: { at: old-french, stem: "plajdz-", morph: [~, PRS.2PL.A] }
    # French plais (1sg), on plaist
    PRS.1SG: { at: french, base: placere.PRS.3SG, morph: ~ }
  events:
    # Spanish placer, not *llazer: pl- kept after Latin placēre
