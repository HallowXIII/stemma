# Latin to Spanish and French, through Western Romance: about a hundred
# words, checked against attested.tsv. See README.md.
name: Romance

notation:
  graphemes: [kʷ, gʷ, ae, au, oe]
  boundary: "+"
  internal-boundaries: false   # joined forms are one word to the rules

stages:
  latin:
    name: Latin
    abbr: Lat.

  # Spoken Latin: the loss of h, and the reduced forms of habēre that the
  # future is built from.
  vulgar-latin:
    name: Vulgar Latin
    abbr: VL
    parent: latin
    rules: "rules/latin-to-wr.bsc#1"

  # Shared by Spanish and French: stress, the vowel merger, the first
  # lenition.
  western-romance:
    name: Western Romance
    abbr: WR
    parent: vulgar-latin
    rules: "rules/latin-to-wr.bsc#2"

  # Reconstructed: Spanish before its first texts. Old Spanish begins after
  # pl-, kl- > ʎ-, so that an event there can follow it (semi-learned claro).
  ibero-romance:
    name: Ibero-Romance
    abbr: IR
    parent: western-romance
    rules: "rules/wr-to-spanish.bsc#1"

  old-spanish:
    name: Old Spanish
    abbr: OSp.
    parent: ibero-romance
    rules: "rules/wr-to-spanish.bsc#2"

  spanish:
    name: Spanish
    abbr: Sp.
    parent: old-spanish
    rules: "rules/wr-to-spanish.bsc#3"
    current: true

  # Reconstructed: French before its first texts. Old French begins after
  # the voicing of p, t, k, so that an event there can follow it
  # (semi-learned pueple).
  gallo-romance:
    name: Gallo-Romance
    abbr: GR
    parent: western-romance
    rules: "rules/wr-to-french.bsc#1"

  old-french:
    name: Old French
    abbr: OF
    parent: gallo-romance
    rules: "rules/wr-to-french.bsc#2"

  french:
    name: French
    abbr: Fr.
    parent: old-french
    rules: "rules/wr-to-french.bsc#3"
    current: true
