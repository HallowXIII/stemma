- id: ir
  form: "*ir₁-"
  gloss: "this (proximal)"
  category: [{ at: proto-echo, is: DEM }]
  paradigm: demonstrative
  events:
    - analogy:
        at: azal
        cell: DIR
        replace: { r₁: r₂ }
        model: "the plural marker -r (< *r₂)"
  expect:
    azal: { DIR: iš, GEN: iri, DAT: irā, LOC: ire, COM: ilem, ABL: iru }
  notes: |
    The regular direct form would be {ir.DIR @ azal !}, since *r₁ > /l/
    word-finally. The actual form {ir.DIR @ azal} takes the *r₂ reflex,
    probably by analogy with the plural -r. The analogy affected only the
    direct cell: compare {ir.COM @ azal}, with regular preconsonantal /l/.
  derivatives:
    - id: iryane
      source: { compound: [ir, yane] }
      gloss: "now"
      category: [{ at: proto-echo, is: ADV }]
      expect: { azal: iryane }
      notes: |
        Formed before the analogy, so it keeps the regular intervocalic
        reflex *r₁ > /r/: {iryane} > {iryane @ azal}.
    - id: iltan
      source: { compound: [ir, tan] }
      gloss: "like this"
      category: [{ at: proto-echo, is: ADV }]
      expect: { azal: iltan }
      notes: |
        Regular preconsonantal *r₁ > /l/.

- id: yor
  form: "*yor₁-"
  gloss: "that (distal)"
  category: [{ at: proto-echo, is: DEM }]
  paradigm: demonstrative
  events:
    - analogy:
        at: azal
        cell: DIR
        replace: { r₁: r₂ }
        model: "ir"
  expect:
    azal: { DIR: yoš, GEN: yori, DAT: yorā, LOC: yore, COM: yolem, ABL: yoru }
  derivatives:
    - id: yoryane
      source: { compound: [yor, yane] }
      gloss: "then"
      category: [{ at: proto-echo, is: ADV }]
      expect: { azal: yoryane }
    - id: yoltan
      source: { compound: [yor, tan] }
      gloss: "like that"
      category: [{ at: proto-echo, is: ADV }]
      expect: { azal: yoltan }

# The second members of the compounds. Their forms and meanings are guesses,
# included only so the example resolves. TODO: replace with real etyma.
- id: yane
  form: "*yane"
  gloss: "? (time)"
  category: [{ at: proto-echo, is: "N" }]
  fate: { old-azal: lost }

- id: tan
  form: "*tan"
  gloss: "? (manner)"
  category: [{ at: proto-echo, is: "N" }]
  fate: { old-azal: lost }
