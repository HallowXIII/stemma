name: Echo

notation:
  graphemes: [r₁, r₂]

stages:
  proto-echo:
    name: Proto-Echo
    abbr: PE

  # One rules file for the Azal line, split at its `report` statement.
  old-azal:
    name: Old Azal
    parent: proto-echo
    rules: "rules/pe-to-azal.bsc#1"

  azal:
    name: Azal
    parent: old-azal
    rules: "rules/pe-to-azal.bsc#2"
    current: true

  # No rules yet: forms are copied from Proto-Echo (with a warning).
  wiyan:
    name: Wiyan
    parent: proto-echo
    current: true
