- id: yen
  form: "*yen"

# Suppletion: the singular direct is built on yen. A different affix for
# one cell, and a cell of this entry's own.
- id: ego
  form: "*ego"
  paradigm: noun
  cells:
    SG.DIR: { base: yen }
    SG.GEN: [~, GEN.IRR]
    VOC: ~
  expect:
    proto: { SG.DIR: yenn, SG.GEN: egoō, PL.DIR: egoran, PL.GEN: egorai, VOC: ego }

- id: bes
  form: "*bes"
  paradigm: verb
  cite: ~                          # the bare stem
  cells:
    PST.3P~dialectal: [~, PST, P3P.DIAL]
  expect:
    proto:
      NPST.1S: besnem
      NPST.1S~archaic: besnaim
      NPST.3P~archaic: besnair
      PST.3P: besvar
      PST.3P~dialectal: besvaš

# A stem of its own for every cell but the singular direct, shared by the
# cells that give it.
- id: homo
  form: "*homō"
  paradigm: noun
  cells:
    SG.GEN: { stem: "*homin" }
    PL.DIR: { stem: "*homin" }
    PL.GEN: { stem: "*homin", morph: [~, PL, GEN.IRR] }
  expect:
    proto: { SG.DIR: homōn, SG.GEN: homini, PL.DIR: hominran, PL.GEN: hominraō }
