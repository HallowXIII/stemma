- id: see
  form: "*ber-"
  bound: true
  paradigm: verb-old
  cells:
    # Joined only at late, from the forms entering it.
    NPST.1S>3S: { at: late, morph: [SBJ.1S, OBJ, ~, S.1S.SHORT] }
  expect:
    mid:   { NPST.1S: berne, PST.1S: biberga }
    late:  { NPST.1S: bibern, NPST.1S~archaic: biberni, PST.1S: bibergan, NPST.1S>3S: biabern }
    other: { NPST.1S: berme, PST.1S: biberka }

# A stem of its own for the past, kept when the paradigm changes at late,
# and a cell joined at late on a stem written as entering late.
- id: go
  form: "*tor-"
  bound: true
  paradigm: verb-old
  cite: { late: ~ }                # the bare stem, from late on
  cells:
    PST.1S: { stem: "*tek-" }
    NPST.1S>3S: { at: late, stem: "tag-", morph: [SBJ.1S, OBJ, ~, S.1S.SHORT] }
  expect:
    mid:   { NPST.1S: torne, PST.1S: bitegga }
    late:  { NPST.1S: bitorn, NPST.1S~archaic: bitorni, PST.1S: biteggan, NPST.1S>3S: biatagn }
    other: { PST.1S: bitekka }

- id: stone
  form: "*tan"
  paradigm: noun-old
  events:
    - repattern: { at: late, paradigm: noun-late }
  expect:
    mid:  { SG: tan, PL: tanga }
    late: { SG: tan, PL: tanga }

# An analogy without `cell:` reaches every cell.
- id: reed
  form: "*kan"
  paradigm: noun-new
  events:
    - analogy: { at: mid, replace: { a: o } }
  expect:
    mid:   { SG: gon, PL: gongo }
    other: { SG: kam, PL: kamka }

# The paradigm's re-formings, and an entry's own `at:` taking precedence.
- id: hear
  form: "*sel"
  paradigm: verb-r
  expect:
    mid:   { NPST.1S: selne, PST.1S: selga, OPT: asel }
    late:  { NPST.1S: seln, PST.1S: selga, OPT: asel }
    other: { NPST.1S: selme, PST.1S: selka }

- id: feel
  form: "*fel"
  paradigm: verb-r
  cells:
    NPST.1S: { at: late, morph: [~, S.1S] }
  expect:
    late:  { NPST.1S: felni }

# An entry's `at:` at another stage leaves the paradigm's re-forming at
# late in force.
- id: taste
  form: "*ret"
  paradigm: verb-r
  cells:
    NPST.1S: { at: mid, morph: [~, PST] }
  expect:
    mid:   { NPST.1S: retga }
    late:  { NPST.1S: retn }

# The paradigm joins OPT at mid; the entry's `at:` at late re-forms it
# there rather than joining it only at late.
- id: sing
  form: "*ran"
  paradigm: verb-r
  cells:
    OPT: { at: late, morph: [~, PST] }
  expect:
    mid:   { OPT: aran }
    late:  { OPT: ranga }

# A list of overrides for one cell: a template of the entry's own, and a
# re-forming on one line.
- id: walk
  form: "*dor"
  paradigm: verb-r
  cells:
    NPST.1S: [[~, PST], { at: late, morph: [~, S.1S] }]
  expect:
    mid:   { NPST.1S: dorga }
    late:  { NPST.1S: dorni }
    other: { NPST.1S: dorka }

- id: jump
  form: "*pol"
  paradigm: verb-p
  expect:
    mid:  { PST.1S: polga }
    late: { PST.1S: polka }

# An analogy given as a rule: only the initial k changes.
- id: nest
  form: "*kekel"
  events:
    - analogy: { at: mid, rule: "k / t / # _" }
  expect:
    mid: tegel
    other: kekel

# Repatterned to noun-mid at mid, so noun-mid becomes noun-new at late,
# and the plural is joined there; the other line keeps noun-late.
- id: wood
  form: "*sur"
  paradigm: noun-late
  events:
    - repattern: { at: mid, paradigm: noun-mid }
  expect:
    mid:   { SG: sur }
    late:  { SG: sur, PL: surga }
    other: { SG: sur, PL: surka }

# Repatterned away from noun-mid at mid, so its `becomes` at late doesn't
# apply.
- id: ash
  form: "*pel"
  paradigm: noun-mid
  events:
    - repattern: { at: mid, paradigm: noun-late }
  expect:
    late: { SG: pel, PL: pelga }

# Lost at mid: neither a `becomes` nor the cells it adds bring it back.
- id: elm
  form: "*mal"
  paradigm: noun-late
  fate: { mid: lost }
  events:
    - repattern: { at: mid, paradigm: noun-mid }
  expect:
    other: { SG: mal, PL: malka }

- id: oak
  form: "*dor"
  paradigm: noun-old
  fate: { mid: lost }
  expect:
    other: { SG: dor }
