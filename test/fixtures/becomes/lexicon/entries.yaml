- id: see
  form: "*ber-"
  bound: true
  paradigm: verb-old
  cells:
    # Joined only at late, from the forms entering it.
    NPST.1S>3S: { at: late, morph: [SBJ.1S, OBJ, ~, S.1S.SHORT] }
  expect:
    mid:   { NPST.1S: berne, PST.1S: biberga }
    late:  { NPST.1S: bibern, NPST.1S~archaic: biberni, PST.1S: bibergan, NPST.1S>3S: biabern }
    other: { NPST.1S: berme, PST.1S: biberka }

# A stem of its own for the past, kept when the paradigm changes at late,
# and a cell joined at late on a stem written as entering late.
- id: go
  form: "*tor-"
  bound: true
  paradigm: verb-old
  cite: { late: ~ }                # the bare stem, from late on
  cells:
    PST.1S: { stem: "*tek-" }
    NPST.1S>3S: { at: late, stem: "tag-", morph: [SBJ.1S, OBJ, ~, S.1S.SHORT] }
  expect:
    mid:   { NPST.1S: torne, PST.1S: bitegga }
    late:  { NPST.1S: bitorn, NPST.1S~archaic: bitorni, PST.1S: biteggan, NPST.1S>3S: biatagn }
    other: { PST.1S: bitekka }

- id: stone
  form: "*tan"
  paradigm: noun-old
  events:
    - repattern: { at: late, paradigm: noun-late }
  expect:
    mid:  { SG: tan, PL: tanga }
    late: { SG: tan, PL: tanga }

# An analogy without `cell:` reaches every cell.
- id: reed
  form: "*kan"
  paradigm: noun-new
  events:
    - analogy: { at: mid, replace: { a: o } }
  expect:
    mid:   { SG: gon, PL: gongo }
    other: { SG: kam, PL: kamka }

# The paradigm's re-formings, and an entry's own `at:` taking precedence.
- id: hear
  form: "*sel"
  paradigm: verb-r
  expect:
    mid:   { NPST.1S: selne, PST.1S: selga, OPT: asel }
    late:  { NPST.1S: seln, PST.1S: selga, OPT: asel }
    other: { NPST.1S: selme, PST.1S: selka }

- id: feel
  form: "*fel"
  paradigm: verb-r
  cells:
    NPST.1S: { at: late, morph: [~, S.1S] }
  expect:
    late:  { NPST.1S: felni }
