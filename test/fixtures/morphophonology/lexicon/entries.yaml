# The bare cell takes the epenthetic vowel; the root and the suffixed
# cells keep the cluster. At modern, the cells inherited from proto go
# through modern's morphophonology (GEN -ī).
- id: ačw
  form: "*ačw"
  gloss: "ash"
  paradigm: noun
  expect:
    proto: { form: ačw, DIR: ačəw, GEN: ačwi, PL: ačwar }
    modern: { form: ačw, DIR: ačew, GEN: ačwī }
  derivatives:
    # Built from a cell formed at the same stage, so it sees the cell
    # after morphophonology.
    - id: ashes
      source: { base: ačw, cell: DIR }
      gloss: "ashes"
      expect: { proto: ačəw }

# A repattern at modern joins the new stem with the forms entering modern,
# so the cells go through proto's morphophonology, and then modern's; the
# entry's own new stem is written, not joined, and goes through neither.
- id: kelw
  form: "*kalw"
  gloss: "smoke"
  paradigm: noun
  events:
    - repattern: { at: modern, paradigm: noun-new, stem: "kelw" }
  expect:
    proto: { DIR: kaləw }
    modern: { form: kelw, DIR: kelew, GEN: kelwī }

# A written root never goes through morphophonology.
- id: tari
  form: "*tari"
  gloss: "pebble"
  expect: { modern: tari }
