- id: valyk
  form: "*valyk"
  paradigm: noun
  notes: |
    Would-be {valyk.SG.GEN @ wiyan !}.
  expect:
    azal: { SG.GEN: valyki, PL.GEN: valykrai }
    wiyan: { SG.DIR: valyk, SG.COM: valykm, PL.COM: valykram }

- id: tor
  form: "*tor"
  paradigm: noun-b
  expect:
    azal: { SG.GEN: tori, PL.DIR: torra }
    wiyan: { PL.COM: torram }

# A cell re-formed on another at the stage that loses that one: the lost
# cell still enters wiyan with its proto form.
- id: kor
  form: "*kor"
  paradigm: noun
  cells:
    SG.COM: { at: wiyan, base: kor.SG.GEN, morph: [~, COM] }
  expect:
    wiyan: { SG.COM: korim }

# Remade on noun below wiyan, where noun has lost the genitive: it gets
# noun as it is there, so no genitive.
- id: sem
  form: "*sem"
  paradigm: noun-dir
  events:
    - repattern: { at: new-wiyan, paradigm: noun }
  expect:
    new-wiyan: { SG.DIR: sem, SG.COM: semm, PL.COM: semram }

# Remade on noun at azal only: noun's loss at wiyan doesn't reach the
# wiyan line, which keeps noun-all.
- id: dal
  form: "*dal"
  paradigm: noun-all
  events:
    - repattern: { at: azal, paradigm: noun }
  expect:
    azal: { SG.GEN: dali }
    wiyan: { SG.GEN: dali, PL.GEN: dalrai }

# Formed at wiyan, where noun has lost the genitive: no genitive.
- id: ren
  form: "ren"
  stage: wiyan
  paradigm: noun
  expect:
    wiyan: { SG.DIR: ren, SG.COM: renm }
