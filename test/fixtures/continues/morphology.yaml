affixes:
  PL:  { form: "*-i" }
  DIR: { form: "*-s" }
  OBL: { form: "*-m" }

paradigms:
  noun:
    dimensions:
      - number: [SG: ~, PL: PL]
      - case: [DIR: DIR, OBL: OBL]
    becomes: { azal: noun-az }
  # Number only. A word formed with it has a bare singular.
  noun-az:
    cite: SG
    cells:
      - SG: { continues: SG.OBL }
      - PL: [PL, { continues: PL.OBL }]
