- id: tako
  form: "*tako"
  paradigm: noun
  expect:
    azal: { SG: takum, PL: takuim }
    wiyan: { SG.DIR: takos, SG.OBL: takom, PL.OBL: takoim }
    new-wiyan: { SG: takom, PL: takoim }

# Continues the direct case in the singular, as French prêtre does.
- id: pero
  form: "*pero"
  paradigm: noun
  cells:
    SG: { continues: SG.DIR }
  expect:
    azal: { SG: perus, PL: peruim }
    wiyan: { SG.DIR: peros, SG.OBL: perom }

# Keeps both, the direct one as a variant.
- id: sire
  form: "*sire"
  paradigm: noun
  cells:
    SG~dir: { continues: SG.DIR }
  expect:
    azal: { SG: sirem, SG~dir: sires, PL: sireim }

# Formed with the new paradigm: from its templates.
- id: nimo
  form: "nimo"
  stage: azal
  paradigm: noun-az
  expect:
    azal: { SG: nimo, PL: nimoi }

# Continues the direct case on one line only (azal); wiyan keeps case.
- id: loma
  form: "*loma"
  paradigm: noun
  cells:
    PL: { at: azal, continues: PL.DIR }
  expect:
    azal: { SG: lumam, PL: lumais }
    wiyan: { PL.DIR: lomais, PL.OBL: lomaim }

# An oblique stem: the entry's changes to the case cells don't bring them
# into the new paradigm.
- id: homa
  form: "*homa"
  paradigm: noun
  cells:
    SG.OBL: { stem: "*homin-" }
    PL.OBL: { stem: "*homin-" }
  expect:
    azal: { SG: huminm, PL: huminim }
    wiyan: { SG.DIR: homas, SG.OBL: hominm }

# The plural is remade on the old oblique singular where case is lost.
- id: seka
  form: "*seka"
  paradigm: noun
  cells:
    PL: { at: azal, base: seka.SG.OBL, morph: [~, PL] }
  expect:
    azal: { SG: sekam, PL: sekami }
    new-wiyan: { SG: sekam, PL: sekaim }
